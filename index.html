<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر التوصيل السريع 🚀</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: #0f172a; color: #fff; font-family: Tahoma, sans-serif; padding: 20px;">

    <div style="text-align: center; margin-bottom: 20px;">
        <h1 style="color: #38bdf8;">متجر التوصيل السريع 🚀</h1>
        <p style="color: #94a3b8;">اطلب بسهولة واصلك لحد باب البيت</p>
        <a href="admin.html" style="color: #f43f5e; text-decoration: none; font-size: 14px;">⚙️ الانتقال لوحة التحكم</a>
    </div>

    <div style="max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
        
        <!-- حاصنة عرض المنتجات -->
        <div id="dynamicMenu"></div>

        <hr style="border: 0; border-top: 1px solid #334155; margin: 20px 0;">

        <h3>🛒 السلة وفاتورة الطلب</h3>
        <div id="cartSummary" style="background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; color: #cbd5e1;">
            السلة فارغة حالياً.. اختر منتجك المفضل!
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
            <input type="text" id="customerName" placeholder="اسم العميل الكريم" style="padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff;">
            <input type="text" id="customerPhone" placeholder="رقم الجوال" style="padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff;">
            <input type="text" id="customerAddress" placeholder="العنوان التفصيلي" style="padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff;">
            
            <button type="button" onclick="getLocation()" style="background: #0ea5e9; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold;">📍 تحديد الموقع (GPS)</button>
            <div id="locationStatus" style="font-size: 12px; color: #38bdf8;"></div>

            <select id="paymentMethod" style="padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff;">
                <option value="كاش عند الاستلام">كاش عند الاستلام</option>
                <option value="تحويل إلكتروني">تحويل إلكتروني</option>
            </select>

            <button type="button" onclick="checkoutOrder()" style="background: #22c55e; color: #fff; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold;">إتمام الطلب عبر الواتساب 🚀</button>
        </div>
    </div>

    <!-- ربط ملف الجافاسكريبت -->
    <script src="script.js"></script>
</body>
</html>
