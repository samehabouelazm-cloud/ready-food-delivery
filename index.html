<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق التوصيل - جاهز</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #f59e0b; }
        .section { background: #1e293b; padding: 15px; margin-bottom: 20px; border-radius: 10px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 10px; }
        .product-card { background: #334155; padding: 15px; border-radius: 8px; text-align: center; }
        .product-card button { background: #f59e0b; color: #fff; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .cart-box { background: #1e293b; padding: 20px; border-radius: 10px; margin-top: 20px; }
        .cart-box input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        #checkoutBtn { background: #22c55e; color: #fff; padding: 15px; font-weight: bold; border: none; border-radius: 8px; width: 100%; cursor: pointer; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 تطبيق جاهز للتوصيل السريع</h1>
    
    <div id="menuContainer">
        <div class="section">
            <h2>قسم المشويات</h2>
            <div class="products-grid">
                <div class="product-card">
                    <h3>سمك بلطي مشوي - للكيلو</h3>
                    <p>100 ج.م</p>
                    <button onclick="addToCart('سمك بلطي مشوي', 100)">إضافة للسلة</button>
                </div>
            </div>
        </div>
        <div class="section">
            <h2>قسم البيض والأجبان</h2>
            <div class="products-grid">
                <div class="product-card">
                    <h3>بيض بلدي - 30 بيضة</h3>
                    <p>130 ج.م</p>
                    <button onclick="addToCart('بيض بلدي - 30 بيضة', 130)">إضافة للسلة</button>
                </div>
            </div>
        </div>
    </div>

    <div class="cart-box">
        <h3>🛒 سلة المشتريات</h3>
        <p id="cartSummary">السلة فارغة</p>
        
        <input type="text" id="customerName" placeholder="اسم العميل *">
        <input type="text" id="customerPhone" placeholder="رقم الجوال * (مثال: 010xxxxxxxx)">
        <input type="text" id="customerAddress" placeholder="عنوان التوصيل *">

        <button id="checkoutBtn" onclick="checkoutOrder()">إتمام وطلب السلة الآن عبر الواتساب 🚀</button>
    </div>
</div>

<script>
    let cartItem = null;

    function addToCart(name, price) {
        cartItem = { name, price };
        document.getElementById('cartSummary').innerHTML = `📦 <b>${name}</b> - ${price} ج.م`;
        alert(`تمت إضافة ${name} بنجاح إلى السلة!`);
    }

    function checkoutOrder() {
        const name = document.getElementById('customerName').value.trim();
        const phone = document.getElementById('customerPhone').value.trim();
        const address = document.getElementById('customerAddress').value.trim();

        if (!name || !phone) {
            alert('من فضلك ادخل الاسم ورقم الجوال على الأقل!');
            return;
        }

        if (!cartItem) {
            alert('السلة فارغة، من فضلك اختر منتجاً أولاً!');
            return;
        }

        let msg = `🛒 طلب جديد عبر المنصة:\n`;
        msg += `👤 الاسم: ${name}\n`;
        msg += `📱 الجوال: ${phone}\n`;
        msg += `📍 العنوان: ${address || 'توصيل سريع'}\n`;
        msg += `📦 المنتج: ${cartItem.name} (${cartItem.price} ج.م)\n`;

        window.open(`https://wa.me/201034101822?text=${encodeURIComponent(msg)}`, '_blank');
    }
</script>

</body>
</html>
