<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاهز في بلطيم - تطبيق العميل</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0b132b; color: #fff; margin: 0; padding: 20px; direction: rtl; text-align: right; }
        .container { max-width: 600px; margin: 0 auto; background: #1c2541; padding: 20px; border-radius: 10px; }
        .item-card { background: #3a506b; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        button { cursor: pointer; padding: 8px 15px; border: none; border-radius: 5px; background: #4cc9f0; color: #000; font-weight: bold; }
        button:hover { background: #4361ee; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ منصة جاهز في بلطيم</h1>
        <p>اختر أصنافك المفضلة وحدد الكميات بكل سهولة:</p>
        
<!-- قسم اختيار الكمية -->
<div class="item-container" style="margin-bottom: 20px;">
    <h3>وجبة كبدة مميزة</h3>
    <p>السعر: 50 جنيه</p>
    <div style="display: flex; align-items: center; gap: 10px; margin: 10px 0;">
        <button type="button" onclick="changeQty(-1)" style="padding: 5px 15px; font-weight: bold; cursor: pointer;">-</button>
        <span id="qty_display" style="font-weight: bold; font-size: 18px; color: #fff;">1</span>
        <button type="button" onclick="changeQty(1)" style="padding: 5px 15px; font-weight: bold; cursor: pointer;">+</button>
    </div>
    <button type="button" onclick="addToCart('وجبة كبدة مميزة', 50)" style="background: #28a745; color: #fff; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">إضافة للسلة</button>
</div>

<!-- ملف JS الخارجي -->
    <script src="script.js"></script>
</body>
</html>
