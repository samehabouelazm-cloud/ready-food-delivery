<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاهز في بلطيم - تطبيق العميل</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0b132b; color: #fff; margin: 0; padding: 20px; direction: rtl; text-align: right; }
        .container { max-width: 600px; margin: 0 auto; background: #1c2541; padding: 20px; border-radius: 10px; }
        .item-card { background: #3a506b; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        button { cursor: pointer; padding: 8px 15px; border: none; border-radius: 5px; background: #4cc9f0; color: #000; font-weight: bold; }
        button:hover { background: #4361ee; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ منصة جاهز في بلطيم</h1>
        <p>اختر أصنافك المفضلة وحدد الكميات بكل سهولة:</p>
        
<!-- قسم اختيار الكمية -->
<div class="item-container">
    <h3>وجبة كبدة مميزة</h3>
    <p>السعر: 50 جنيه</p>
    <div class="qty-control">
        <button onclick="changeQty(1)">+</button>
        <span id="qty_display">1</span>
        <button onclick="changeQty(-1)">-</button>
    </div>
    <button class="add-to-cart" onclick="addToCart()">إضافة للسلة</button>
</div>

<!-- قسم بيانات التوصيل -->
<div class="delivery-container">
    <h3>بيانات التوصيل</h3>
    <input type="text" id="customerName" placeholder="الاسم الكريم">
    <input type="text" id="customerPhone" placeholder="رقم الهاتف">
    <input type="text" id="customerAddress" placeholder="العنوان بالتفصيل">
    <button onclick="saveDetails()">حفظ البيانات</button>
</div>
<!-- ملف JS الخارجي -->
    <script src="script.js"></script>
</body>
</html>
