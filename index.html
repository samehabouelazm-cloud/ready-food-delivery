<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر التوصيل السريع 🚀</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; }
        .store-container { max-width: 650px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        
        /* البانر الاحترافي */
        .banner { text-align: center; margin-bottom: 25px; padding: 20px; background: linear-gradient(135deg, #0284c7, #0f172a); border-radius: 12px; border: 1px solid #38bdf8; }
        .banner h1 { color: #38bdf8; font-size: 24px; margin-bottom: 8px; }
        .banner p { color: #94a3b8; font-size: 14px; margin-bottom: 12px; }
        .admin-link { color: #f43f5e; text-decoration: none; font-size: 13px; font-weight: bold; background: rgba(244, 63, 94, 0.1); padding: 6px 12px; border-radius: 20px; display: inline-block; }
        
        /* الأقسام والمنتجات */
        .section { margin-bottom: 20px; }
        .section-header { border-bottom: 2px solid #38bdf8; padding-bottom: 5px; margin-bottom: 12px; }
        .section-header h2 { font-size: 18px; color: #38bdf8; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
        
        .product-card { background: #0f172a; border-radius: 10px; overflow: hidden; border: 1px solid #334155; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .product-img { width: 100%; height: 110px; object-fit: cover; }
        .product-info { padding: 10px; display: flex; flex-direction: column; gap: 6px; }
        .product-info h3 { font-size: 14px; color: #fff; }
        .price { color: #34d399; font-weight: bold; font-size: 14px; }
        
        .add-btn { background: #38bdf8; color: #0f172a; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .add-btn:hover { background: #7dd3fc; }

        /* السلة والفاتورة */
        .cart-box { background: #0f172a; padding: 15px; border-radius: 10px; margin: 20px 0; border: 1px solid #334155; }
        .cart-box h3 { font-size: 16px; margin-bottom: 8px; color: #38bdf8; }
        #cartSummary { font-size: 14px; color: #cbd5e1; line-height: 1.6; }

        /* نموذج الطلب */
        .form-group { display: flex; flex-direction: column; gap: 10px; }
        input, select { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; }
        
        .gps-btn { background: #0ea5e9; color: #fff; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #locationStatus { font-size: 12px; color: #38bdf8; }
        
        .checkout-btn { background: #22c55e; color: #fff; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; text-align: center; margin-top: 5px; }
        .checkout-btn:hover { background: #16a34a; }
    </style>
</head>
<body>

<div class="store-container">
    <!-- البانر الاحترافي -->
    <div class="banner">
        <h1>متجر التوصيل السريع 🚀</h1>
        <p>اطلب بسهولة واصلك لحد باب البيت بأسرع وقت</p>
        <a href="admin.html" class="admin-link">⚙️ الانتقال لوحة التحكم لإدارة المنتجات</a>
    </div>

    <!-- الأقسام والمنتجات الديناميكية -->
    <div id="dynamicMenu"></div>

    <hr style="border: 0; border-top: 1px solid #334155; margin: 20px 0;">

    <!-- السلة والفاتورة -->
    <div class="cart-box">
        <h3>🛒 السلة وفاتورة الطلب</h3>
        <div id="cartSummary">السلة فارغة حالياً.. اختر منتجاً مفضلاً!</div>
    </div>

    <!-- نموذج بيانات العميل والـ GPS -->
    <div class="form-group">
        <input type="text" id="customerName" placeholder="اسم العميل الكريم *">
        <input type="text" id="customerPhone" placeholder="رقم الجوال *">
        <input type="text" id="customerAddress" placeholder="العنوان التفصيلي *">
        
        <button type="button" class="gps-btn" onclick="getLocation()">📍 تحديد الموقع التلقائي (GPS)</button>
        <div id="locationStatus"></div>

        <select id="paymentMethod">
            <option value="كاش عند الاستلام">كاش عند الاستلام</option>
            <option value="انستا باي">انستا باي (InstaPay)</option>
            <option value="فودافون كاش">فودافون كاش</option>
        </select>

        <button type="button" class="checkout-btn" onclick="checkoutOrder()">إتمام الطلب عبر الواتساب 🚀</button>
    </div>
</div>

<script>
    let cartItem = null;
    let customerCoords = null;

    function loadStoreProducts() {
        let products = JSON.parse(localStorage.getItem('storeProducts')) || [];
        
        if (products.length === 0) {
            products = [
                { name: 'بيض بلدي - 30 بيضة', price: 130, category: 'المنتجات الطازجة', image: 'https://images.unsplash.com/photo-1516467508483-a7212febe31a?w=300&auto=format&fit=crop&q=60' },
                { name: 'كيلو سمك بلطي مشوي', price: 100, category: 'المأكولات البحرية', image: 'https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?w=300&auto=format&fit=crop&q=60' },
                { name: 'وجبة برجر مشوي سريعة', price: 120, category: 'الوجبات السريعة', image: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300&auto=format&fit=crop&q=60' }
            ];
        }

        const menuContainer = document.getElementById('dynamicMenu');
        if (!menuContainer) return;
        menuContainer.innerHTML = '';

        let categories = {};
        products.forEach(p => {
            let catName = p.category || 'أقسام عامة';
            if (!categories[catName]) categories[catName] = [];
            categories[catName].push(p);
        });

        for (let cat in categories) {
            let items = categories[cat];
            let sectionHtml = `<div class="section"><div class="section-header"><h2>📂 ${cat}</h2></div><div class="products-grid">`;
            
            items.forEach(p => {
                sectionHtml += `
                    <div class="product-card">
                        <img src="${p.image || 'https://via.placeholder.com/300'}" alt="${p.name}" class="product-img">
                        <div class="product-info">
                            <h3>${p.name}</h3>
                            <div class="price">${p.price} ج.م</div>
                            <button onclick="addToCart('${p.name.replace(/'/g, "\\'")}', ${p.price})" class="add-btn">إضافة للسلة 🛒</button>
                        </div>
                    </div>
                `;
            });
            
            sectionHtml += `</div></div>`;
            menuContainer.innerHTML += sectionHtml;
        }
        updateCartDisplay();
    }

    function addToCart(name, price) {
        cartItem = { name, price };
        updateCartDisplay();
        alert(`تمت إضافة "${name}" إلى السلة بنجاح!`);
    }

    function getLocation() {
        const statusDiv = document.getElementById('locationStatus');
        const addressInput = document.getElementById('customerAddress');

        if (!navigator.geolocation) {
            statusDiv.innerHTML = '⚠️ المتصفح لا يدعم تحديد الموقع.';
            return;
        }

        statusDiv.innerHTML = '⏳ جاري تحديد موقعك الحالي بدقة عبر الـ GPS...';
        
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                customerCoords = `https://maps.google.com/?q=${lat},${lng}`;
                addressInput.value = `📍 موقع GPS الحالي (تم التحديد تلقائياً)`;
                statusDiv.innerHTML = '✅ تم تحديد الموقع الواقعي بنجاح!';
            },
            (error) => {
                statusDiv.innerHTML = '❌ تعذر تحديد الموقع. تأكد من تفعيل صلاحية الـ GPS.';
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }

    function updateCartDisplay() {
        const summaryDiv = document.getElementById('cartSummary');
        if (!summaryDiv) return;
        const deliveryFee = parseFloat(localStorage.getItem('storeDeliveryFee')) || 20;

        if (!cartItem) {
            summaryDiv.innerHTML = `السلة فارغة حالياً.. اختر منتجاً مفضلاً من القائمة أدناه!<br>🛵 <b>قيمة التوصيل للمندوب:</b> ${deliveryFee} ج.م`;
            return;
        }

        let total = parseFloat(cartItem.price) + deliveryFee;
        summaryDiv.innerHTML = `📦 <b>المنتج المختار:</b> ${cartItem.name} <br>` +
                                `🏷 <b>سعر السلعة:</b> ${cartItem.price} ج.م<br>` +
                                `🛵 <b>قيمة التوصيل للمندوب:</b> ${deliveryFee} ج.م<br>` +
                                `💰 <b>الإجمالي النهائي:</b> <span style="color: #34d399; font-weight: bold;">${total} ج.م</span>`;
    }

    function checkoutOrder() {
        const name = document.getElementById('customerName').value.trim();
        const phone = document.getElementById('customerPhone').value.trim();
        let address = document.getElementById('customerAddress').value.trim();
        const payment = document.getElementById('paymentMethod').value;
        const deliveryFee = parseFloat(localStorage.getItem('storeDeliveryFee')) || 20;

        if (!name || !phone || !address) {
            alert('من فضلك ادخل الاسم، الجوال، والعنوان أو موقع الـ GPS!');
            return;
        }

        if (!cartItem) {
            alert('السلة فارغة، اختر منتجاً أولاً من المتجر!');
            return;
        }

        let itemPrice = parseFloat(cartItem.price);
        let total = itemPrice + deliveryFee;
        let locationText = address;
        
        if (customerCoords) {
            locationText += `\nرابط الخريطة: ${customerCoords}`;
        }

        let msg = "🧾 فاتورة طلب جديدة متكاملة\n" +
                  "-------------------\n" +
                  "👤 بيانات العميل:\n" +
                  "• الاسم: " + name + "\n" +
                  "• الجوال: " + phone + "\n" +
                  "• العنوان: " + locationText + "\n" +
                  "• الدفع: " + payment + "\n" +
                  "-------------------\n" +
                  "📦 تفاصيل الأسعار:\n" +
                  "• سعر السلعة: " + itemPrice + " ج.م\n" +
                  "• التوصيل: " + deliveryFee + " ج.م\n" +
                  "-------------------\n" +
                  "💰 الإجمالي النهائي: " + total + " ج.م";

        // 1. فتح الواتساب لإرسال الطلب
        window.open(`https://wa.me/201034101822?text=${encodeURIComponent(msg)}`, '_blank');

        // 2. إظهار رسالة إتمام الطلب ومعالجته فوراً داخل خانة السلة
        const cartSummary = document.getElementById('cartSummary');
        if (cartSummary) {
            cartSummary.innerHTML = `
                <div style="background: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; padding: 15px; border-radius: 8px; text-align: center; color: #4ade80;">
                    <h3 style="margin-bottom: 5px; color: #4ade80;">🎉 تم إرسال طلبك بنجاح!</h3>
                    <p style="font-size: 13px; color: #cbd5e1;">جاري معالجة الطلب والتواصل معك عبر الواتساب قريباً جداً.</p>
                </div>
            `;
        }

        // 3. تصفير السلة والحقول
        cartItem = null;
        customerCoords = null;
        document.getElementById('customerName').value = '';
        document.getElementById('customerPhone').value = '';
        document.getElementById('customerAddress').value = '';
        const statusDiv = document.getElementById('locationStatus');
        if(statusDiv) statusDiv.innerHTML = '';
    }

    window.onload = loadStoreProducts;
</script>
</body>
</html>
