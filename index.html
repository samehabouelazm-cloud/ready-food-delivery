<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق التوصيل</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="hero-banner">
        <h1>🚀 متجر التوصيل السريع</h1>
        <p>اطلب بسهولة واصلك لحد باب البيت</p>
    </div>
    <a href="admin.html" class="admin-link">⚙ الانتقال لوحة التحكم</a>
    <div id="dynamicMenu"></div>
    <div class="cart-box">
        <h3>🛒 السلة وفاتورة الطلب</h3>
        <div class="cart-summary" id="cartSummary">السلة فارغة حالياً</div>
        <input type="text" id="customerName" placeholder="الاسم الكريم *">
        <input type="text" id="customerPhone" placeholder="رقم الجوال *">
        <input type="text" id="customerAddress" placeholder="العنوان بالتفصيل">
        <button type="button" onclick="getLocation()" style="background:#38bdf8;color:#0f172a;border:none;padding:8px;border-radius:6px;width:100%;font-weight:bold;margin:5px 0;cursor:pointer;">📍 تحديد الموقع (GPS)</button>
        <div id="locationStatus" style="font-size:11px;color:#34d399;"></div>
        <select id="paymentMethod" style="width:100%;padding:8px;background:#0f172a;color:#fff;border-radius:6px;margin:5px 0;">
            <option value="كاش">كاش عند الاستلام</option>
            <option value="انستا باي">انستا باي</option>
            <option value="فودافون كاش">فودافون كاش</option>
        </select>
        <button id="checkoutBtn" onclick="checkoutOrder()" style="background:#22c55e;color:#fff;border:none;padding:10px;width:100%;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:8px;">إتمام الطلب عبر الواتساب 🚀</button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
