<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة جاهز للطلبات - العميل</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; padding: 20px; direction: rtl; }
        .container { max-width: 650px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1, h2, h3 { color: #f59e0b; text-align: center; }
        .section { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
        input[type="text"], select { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #334155; background: #1e293b; color: #fff; box-sizing: border-box; }
        .category-title { color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 5px; margin-top: 15px; font-size: 16px; }
        .product-row { display: flex; align-items: center; justify-content: space-between; background: #1e293b; padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #475569; }
        .product-row label { display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1; }
        .product-row input[type="number"] { width: 70px; padding: 5px; text-align: center; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 4px; margin-bottom: 0; }
        button { cursor: pointer; font-weight: bold; border: none; border-radius: 5px; padding: 12px; background: #22c55e; color: #fff; width: 100%; font-size: 16px; }
        button:hover { background: #16a34a; }
    </style>

    <!-- ربط مكتبة Firebase (الإصدار 9) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBur8SO0RjrJvutWYRy7QdRepUJWtQzQLY",
            authDomain: "readystore-542e0.firebaseapp.com",
            projectId: "readystore-542e0",
            storageBucket: "readystore-542e0.firebasestorage.app",
            messagingSenderId: "698121296035",
            appId: "1:698121296035:web:6d237104d976e11120c716",
            measurementId: "G-56NZSGK3P2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // الأقسام والمنتجات المتاحة
        const categories = [
            {
                name: "🐟 قسم الأسماك والمأكولات البحرية",
                items: [
                    { id: 101, name: "سمك بلطي مشوي - للكيلو", price: 100 },
                    { id: 102, name: "كيلو جمبري مقلي", price: 250 },
                    { id: 103, name: "صينية بوري بالفرن", price: 150 }
                ]
            },
            {
                name: "🍗 قسم الوجبات الرئيسية والمشويات",
                items: [
                    { id: 201, name: "وجبة فراخ مشوية كاملة", price: 180 },
                    { id: 202, name: "نصف فرخة مشوية على الفحم", price: 100 },
                    { id: 203, name: "طبق كفته مشوية", price: 120 }
                ]
            },
            {
                name: "🍟 قسم الإضافات والمقبلات",
                items: [
                    { id: 301, name: "طبق أرز سيراديش", price: 30 },
                    { id: 302, name: "سلطة خضراء بلدي", price: 20 },
                    { id: 303, name: "بطاطس محمرة", price: 25 }
                ]
            }
        ];

        window.renderMenu = function() {
            const container = document.getElementById('menuContainer');
            let html = '';
            
            categories.forEach(cat => {
                html += `<div class="category-title"><strong>${cat.name}</strong></div>`;
                cat.items.forEach(p => {
                    html += `
                        <div class="product-row">
                            <label>
                                <input type="checkbox" class="product-check" data-id="${p.id}" data-name="${p.name}" data-price="${p.price}" onchange="toggleQty(${p.id})">
                                <span>${p.name} (${p.price} جنيه)</span>
                            </label>
                            <input type="number" id="qty_${p.id}" value="1" min="1" disabled>
                        </div>
                    `;
                });
            });
            container.innerHTML = html;
        }

        window.toggleQty = function(id) {
            const checkbox = document.querySelector(`input[data-id="${id}"]`);
            const qtyInput = document.getElementById(`qty_${id}`);
            qtyInput.disabled = !checkbox.checked;
        }

        window.sendOrder = function() {
            const customerName = document.getElementById('customerName').value.trim();
            const customerAddress = document.getElementById('customerAddress').value.trim();
            const paymentMethod = document.getElementById('paymentMethod').value;

            if (!customerName || !customerAddress) {
                alert('الرجاء إدخال الاسم والعنوان بالتفصيل!');
                return;
            }

            const checkedBoxes = document.querySelectorAll('.product-check:checked');
            if (checkedBoxes.length === 0) {
                alert('الرجاء اختيار صنف واحد على الأقل!');
                return;
            }

            let selectedItems = [];
            let totalAmount = 0;

            checkedBoxes.forEach(box => {
                const id = box.getAttribute('data-id');
                const name = box.getAttribute('data-name');
                const price = parseFloat(box.getAttribute('data-price'));
                const qty = parseInt(document.getElementById(`qty_${id}`).value) || 1;

                selectedItems.push({
                    name: name,
                    quantity: qty,
                    price: price
                });

                totalAmount += (price * qty);
            });

            const orderId = Math.floor(1000 + Math.random() * 9000);
            const orderData = {
                id: orderId,
                customerName: customerName,
                customerAddress: customerAddress,
                paymentMethod: paymentMethod,
                items: selectedItems,
                total: totalAmount,
                status: 'قيد المراجعة',
                time: new Date().toLocaleTimeString('ar-EG')
            };

            push(ref(db, 'adminOrders'), orderData)
                .then(() => {
                    alert(`تم إرسال طلبك بنجاح! رقم الطلب: #${orderId}`);
                    location.reload();
                })
                .catch((error) => {
                    alert('حدث خطأ أثناء الإرسال: ' + error.message);
                });
        }

        window.onload = function() {
            renderMenu();
        };
    </script>
</head>
<body>
    <div class="container">
        <h1>🛒 منصة جاهز - طلبات العملاء</h1>

        <div class="section">
            <h2>بيانات التوصيل</h2>
            <input type="text" id="customerName" placeholder="اسم العميل الكريم">
            <input type="text" id="customerAddress" placeholder="العنوان بالتفصيل (الشارع، رقم العمارة)">
            <select id="paymentMethod">
                <option value="كاش">الدفع نقداً عند الاستلام (كاش)</option>
                <option value="فودافون كاش">فودافون كاش</option>
            </select>
        </div>

        <div class="section">
            <h2>قائمة الأقسام والأصناف</h2>
            <div id="menuContainer">جاري تحميل الأقسام...</div>
        </div>

        <button type="button" onclick="sendOrder()">إرسال الطلب الآن 🚀</button>
    </div>
</body>
</html>
