<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاهز في بلطيم - لوحة التحكم الشاملة</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .container { max-width: 950px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
    header h1 { color: #f59e0b; font-size: 22px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    .btn { background: #10b981; color: #fff; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    select, input { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; }
    .order-item { border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📦 جاهز في بلطيم - لوحة التحكم الشاملة</h1>
    <button class="btn" onclick="loadAll()">تحديث البيانات 🔄</button>
  </header>

  <div class="card" style="margin-bottom: 20px;">
    <h3>➕ إضافة صنف / خدمة جديدة إلى الأقسام</h3>
    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr 120px; gap:10px; margin-top:10px;">
      <input type="text" id="itemName" placeholder="اسم المنتج/الخدمة">
      <select id="itemCat">
        <option value="🍔 مأكولات ومطاعم">🍔 مأكولات ومطاعم</option>
        <option value="🥦 خضروات وفواكه">🥦 خضروات وفواكه</option>
        <option value="🫘 بقوليات وعطارة">🫘 بقوليات وعطارة</option>
        <option value="🐟 أسماك ومأكولات بحرية">🐟 أسماك ومأكولات بحرية</option>
        <option value="🥩 لحوم وطيور">🥩 لحوم وطيور</option>
        <option value="📱 إلكترونيات وصيانة">📱 إلكترونيات وصيانة</option>
        <option value="🛒 سوبر ماركت">🛒 سوبر ماركت</option>
        <option value="🔥 توصيل غاز">🔥 توصيل غاز</option>
        <option value="🚗 توصيل مشاوير خاصة">🚗 توصيل مشاوير خاصة</option>
      </select>
      <input type="number" id="itemPrice" placeholder="السعر (ج.م)">
      <button class="btn" onclick="addMenuItem()">إضافة ➕</button>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>🚴 إدارة الكباتن</h3>
      <div style="display:flex; gap:10px; margin-top:10px;">
        <input type="text" id="driverName" placeholder="اسم الكابتن">
        <input type="text" id="driverPhone" placeholder="رقم الجوال">
        <button class="btn" onclick="addDriver()">إضافة</button>
      </div>
      <div id="driversList" style="margin-top:15px;">جاري التحميل...</div>
    </div>

    <div class="card">
      <h3>🛒 الطلبات الواردة من الأقسام والعملاء</h3>
      <div id="ordersList">جاري التحميل...</div>
    </div>
  </div>
</div>

<script>
  function loadAll() {
    loadDrivers();
    loadOrders();
  }

  function loadDrivers() {
    const drivers = JSON.parse(localStorage.getItem('jahez_drivers')) || [];
    const listEl = document.getElementById('driversList');
    
    if (drivers.length === 0) {
      listEl.innerHTML = '<p style="color:#94a3b8; font-size:14px;">لا يوجد كباتن مضافين حالياً.</p>';
      return;
    }

    listEl.innerHTML = drivers.map(d => `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span>${d.name} (${d.phone})</span>
        <button onclick="deleteDriver('${d.id}')" style="color:#ef4444; background:none; border:none; cursor:pointer;">حذف ❌</button>
      </div>
    `).join('');
  }

  function loadOrders() {
    const orders = JSON.parse(localStorage.getItem('jahez_orders')) || [];
    const drivers = JSON.parse(localStorage.getItem('jahez_drivers')) || [];
    const savedCustomer = JSON.parse(localStorage.getItem('jahez_saved_customer')) || {};
    const listEl = document.getElementById('ordersList');

    if (orders.length === 0) {
      // جلب السلة الحالية كطلب افتراضي لو وُجدت
      const cart = JSON.parse(localStorage.getItem('jahez_cart')) || [];
      if(cart.length > 0) {
        orders.push({
          id: '101',
          items: cart,
          customerName: savedCustomer.name || 'عميل كريم',
          phone: savedCustomer.phone || 'غير محدد',
          customerAddress: savedCustomer.address || 'بلطيم',
          status: 'قيد التحضير',
          driverId: ''
        });
      } else {
        listEl.innerHTML = '<p style="color:#94a3b8; font-size:14px;">لا توجد طلبات واردة حالياً.</p>';
        return;
      }
    }

    listEl.innerHTML = orders.map(o => `
      <div class="order-item">
        <p><strong>طلب #${o.id || '1'}</strong></p>
        <p>العميل: ${o.customerName || savedCustomer.name || '-'} (${o.phone || savedCustomer.phone || '-'})</p>
        <p style="color:#38bdf8; font-size:13px;">🏠 العنوان: ${o.customerAddress || savedCustomer.address || 'غير محدد'}</p>
        <p style="color:#10b981;">الحالة: ${o.status || 'قيد التحضير'}</p>
        <select onchange="assignDriver('${o.id}', this.value)" style="margin-top:8px;">
          <option value="">إسناد لكابتن...</option>
          ${drivers.map(d => `<option value="${d.id}" ${o.driverId == d.id ? 'selected' : ''}>${d.name}</option>`).join('')}
        </select>
      </div>
    `).join('');
  }

  function addDriver() {
    const name = document.getElementById('driverName').value;
    const phone = document.getElementById('driverPhone').value;
    if(!name) return;

    let drivers = JSON.parse(localStorage.getItem('jahez_drivers')) || [];
    drivers.push({ id: Date.now().toString(), name, phone });
    localStorage.setItem('jahez_drivers', JSON.stringify(drivers));

    document.getElementById('driverName').value = '';
    document.getElementById('driverPhone').value = '';
    loadAll();
  }

  function deleteDriver(id) {
    let drivers = JSON.parse(localStorage.getItem('jahez_drivers')) || [];
    drivers = drivers.filter(d => d.id !== id);
    localStorage.setItem('jahez_drivers', JSON.stringify(drivers));
    loadAll();
  }

  function assignDriver(orderId, driverId) {
    if(!driverId) return;
    let orders = JSON.parse(localStorage.getItem('jahez_orders')) || [];
    let order = orders.find(o => o.id == orderId);
    if(order) {
      order.driverId = driverId;
      order.status = 'جاري التوصيل';
      localStorage.setItem('jahez_orders', JSON.stringify(orders));
      loadOrders();
    }
  }

  function addMenuItem() {
    const name = document.getElementById('itemName').value;
    const category = document.getElementById('itemCat').value;
    const price = document.getElementById('itemPrice').value;
    if(!name) return;

    let menu = JSON.parse(localStorage.getItem('jahez_menu')) || [];
    menu.push({ id: Date.now().toString(), name, category, price });
    localStorage.setItem('jahez_menu', JSON.stringify(menu));

    alert('تمت إضافة المنتج/الخدمة للقسم بنجاح');
    document.getElementById('itemName').value = '';
    document.getElementById('itemPrice').value = '';
  }

  document.addEventListener('DOMContentLoaded', loadAll);
</script>
</body>
</html>
