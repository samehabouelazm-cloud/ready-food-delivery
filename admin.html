<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة المنصة والمنتجات - جاهز</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; padding: 20px; direction: rtl; }
        .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1, h2, h3 { color: #f59e0b; text-align: center; }
        .section { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
        input, select { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #334155; background: #1e293b; color: #fff; box-sizing: border-box; }
        button { cursor: pointer; font-weight: bold; border: none; border-radius: 5px; padding: 10px 15px; background: #22c55e; color: #fff; }
        .danger-btn { background: #ef4444; color: #fff; padding: 5px 10px; font-size: 12px; }
        .map-btn { background: #3b82f6; padding: 6px 12px; font-size: 13px; text-decoration: none; border-radius: 4px; display: inline-block; color: #fff; }
        .menu-item-card { background: #1e293b; padding: 12px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #475569; display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .item-img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #475569; }
        .driver-row { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 8px 12px; border-radius: 5px; margin-bottom: 8px; border: 1px solid #475569; }
        .order-card-admin { background: #1e293b; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 2px solid #f59e0b; }
        .sound-badge { background: #334155; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 15px; font-size: 13px; border: 1px solid #475569; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBur8SO0RjrJvutWYRy7QdRepUJWtQzQLY",
            authDomain: "readystore-542e0.firebaseapp.com",
            projectId: "readystore-542e0",
            storageBucket: "readystore-542e0.firebasestorage.app",
            messagingSenderId: "698121296035",
            appId: "1:698121296035:web:6d237104d976e11120c716",
            measurementId: "G-56NZSGK3P2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let globalDrivers = [];
        let previousTotalOrders = -1;
        let audioContext = null;

        function checkAdminSound() {
            if (localStorage.getItem('jahez_admin_sound') === 'true') {
                initAudioContext();
            } else {
                document.getElementById('adminSoundDiv').style.display = 'block';
            }
        }

        function initAudioContext() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                localStorage.setItem('jahez_admin_sound', 'true');
                document.getElementById('adminSoundDiv').style.display = 'none';
            } catch (e) { console.log(e); }
        }

        window.enableAdminSound = function() {
            initAudioContext();
            playAdminAlarm();
            alert("✅ تم تفعيل وحفظ التنبيهات بنجاح!");
        }

        function playAdminAlarm() {
            try {
                if (!audioContext) { audioContext = new (window.AudioContext || window.webkitAudioContext)(); }
                if (audioContext.state === 'suspended') { audioContext.resume(); }
                const now = audioContext.currentTime;
                [0, 0.2, 0.4].forEach((delay, index) => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(500 + (index * 250), now + delay);
                    gain.gain.setValueAtTime(0.5, now + delay);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.18);
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.start(now + delay);
                    osc.stop(now + delay + 0.18);
                });
            } catch (e) { console.log(e); }
        }

        function listenToDrivers() {
            const driversRef = ref(db, 'driversList');
            onValue(driversRef, (snapshot) => {
                const data = snapshot.val();
                globalDrivers = [];
                const container = document.getElementById('driversListContainer');
                if (!data) { container.innerHTML = '<p style="color: #94a3b8;">لا يوجد كباتن مسجلين حالياً.</p>'; return; }
                let html = '<p><strong>الكباتن المتاحون:</strong></p>';
                Object.keys(data).forEach((key) => {
                    let d = data[key];
                    globalDrivers.push({ id: key, name: d.name, phone: d.phone });
                    html += `
                        <div class="driver-row">
                            <span>🚴‍♂️ ${d.name} (${d.phone})</span>
                            <button type="button" class="danger-btn" onclick="deleteDriver('${key}')">حذف</button>
                        </div>
                    `;
                });
                container.innerHTML = html;
            });
        }

        window.addDriver = function() {
            const name = document.getElementById('driverNameInput').value.trim();
            const phone = document.getElementById('driverPhoneInput').value.trim();
            if (!name || !phone) { alert('أدخل اسم ورقم الكابتن!'); return; }
            push(ref(db, 'driversList'), { name, phone });
            document.getElementById('driverNameInput').value = '';
            document.getElementById('driverPhoneInput').value = '';
            alert('تمت إضافة الكابتن بنجاح!');
        }

        window.deleteDriver = function(key) {
            if (confirm('حذف هذا الكابتن؟')) remove(ref(db, 'driversList/' + key));
        }

        function listenToMenu() {
            const menuRef = ref(db, 'restaurantMenu');
            onValue(menuRef, (snapshot) => {
                const data = snapshot.val();
                const container = document.getElementById('adminMenuContainer');
                if (!data) { container.innerHTML = '<p style="color: #94a3b8;">لا توجد أصناف مضافة حالياً.</p>'; return; }
                let html = '';
                Object.keys(data).forEach((key) => {
                    let item = data[key];
                    let imgSrc = item.image ? item.image : 'https://via.placeholder.com/60?text=No+Img';
                    let catImgSrc = item.categoryImage ? item.categoryImage : 'https://via.placeholder.com/40?text=Cat';
                    html += `
                        <div class="menu-item-card">
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <img src="${imgSrc}" class="item-img" alt="">
                                <div>
                                    <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 3px;">
                                        <img src="${catImgSrc}" style="width: 20px; height: 20px; border-radius: 50%; object-fit: cover;" alt="">
                                        <span style="background: #334155; padding: 2px 6px; border-radius: 4px; font-size: 11px; color: #38bdf8;">${item.category}</span>
                                    </div>
                                    <h4 style="margin: 4px 0; color: #fff;">${item.name}</h4>
                                    <span style="color: #22c55e; font-size: 13px;">${item.price} جنيه</span>
                                </div>
                            </div>
                            <button type="button" class="danger-btn" onclick="deleteMenuItem('${key}')">حذف</button>
                        </div>
                    `;
                });
                container.innerHTML = html;
            });
        }

        window.addMenuItem = function() {
            const category = document.getElementById('itemCategory').value.trim();
            const categoryImage = document.getElementById('categoryImage').value.trim();
            const name = document.getElementById('itemName').value.trim();
            const price = parseFloat(document.getElementById('itemPrice').value);
            const image = document.getElementById('itemImage').value.trim();

            if (!category || !name || isNaN(price)) {
                alert('الرجاء إدخال البيانات بشكل صحيح!');
                return;
            }

            push(ref(db, 'restaurantMenu'), { category, categoryImage: categoryImage || '', name, price, image: image || '' });
            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            document.getElementById('itemImage').value = '';
            alert('تمت إضافة الصنف بنجاح!');
        }

        window.deleteMenuItem = function(key) {
            if (confirm('حذف هذا الصنف؟')) remove(ref(db, 'restaurantMenu/' + key));
        }

        function listenToOrders() {
            const container = document.getElementById('adminOrdersList');
            const ordersRef = ref(db, 'adminOrders');

            onValue(ordersRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) { 
                    container.innerHTML = '<p style="color: #94a3b8; text-align: center;">لا توجد طلبات واردة حالياً.</p>'; 
                    previousTotalOrders = 0;
                    return; 
                }

                let totalOrdersCount = Object.keys(data).length;
                if (previousTotalOrders !== -1 && totalOrdersCount > previousTotalOrders) {
                    playAdminAlarm();
                }
                previousTotalOrders = totalOrdersCount;

                let html = '';
                Object.keys(data).forEach((orderKey) => {
                    let order = data[orderKey];
                    let itemsText = order.items ? order.items.map(i => `${i.name} (x${i.quantity})`).join(', ') : '';
                    let currentDriver = order.driver || '';
                    let deliveryFee = order.deliveryFee || 0;
                    let finalTotal = order.subtotal + parseFloat(deliveryFee);

                    let driverOptions = `<option value="">اختر الكابتن للإسناد</option>`;
                    globalDrivers.forEach(d => {
                        driverOptions += `<option value="${d.name}" ${currentDriver === d.name ? 'selected' : ''}>${d.name}</option>`;
                    });

                    let mapLink = `https://www.google.com/maps?q=${order.lat},${order.lng}`;

                    html += `
                        <div class="order-card-admin">
                            <h3 style="color: #f59e0b; margin-top: 0;">🚨 طلب جديد #${order.id} - ${order.time}</h3>
                            <p><strong>اسم العميل:</strong> ${order.customerName}</p>
                            <p><strong>رقم الجوال:</strong> ${order.customerPhone}</p>
                            <p><strong>العنوان بالتفصيل:</strong> ${order.customerAddress}</p>
                            <p><strong>موقع العميل:</strong> <a href="${mapLink}" target="_blank" class="map-btn">🗺️ عرض الموقع على الخريطة</a></p>
                            <p><strong>طريقة الدفع:</strong> <span style="color: #38bdf8; font-weight: bold;">${order.paymentMethod}</span></p>
                            <p><strong>الأصناف:</strong> ${itemsText}</p>
                            <p><strong>قيمة المشتريات:</strong> ${order.subtotal} جنيه</p>
                            
                            <!-- خانة إدخال قيمة التوصيل اليدوية -->
                            <div style="background: #0f172a; padding: 10px; border-radius: 6px; margin: 10px 0; border: 1px solid #334155;">
                                <label style="font-size: 12px; color: #fbbf24; display: block; margin-bottom: 5px;">أدخل قيمة التوصيل يدوياً (جنيه):</label>
                                <div style="display: flex; gap: 8px;">
                                    <input type="number" id="fee_${orderKey}" value="${deliveryFee}" placeholder="0" style="margin-bottom: 0; flex: 1;">
                                    <button type="button" style="background: #3b82f6; padding: 5px 12px;" onclick="updateDeliveryFee('${orderKey}', ${order.subtotal})">حفظ التوصيل</button>
                                </div>
                            </div>

                            <p style="color: #22c55e; font-weight: bold; font-size: 15px;">الإجمالي النهائي (المشتريات + التوصيل): ${finalTotal} جنيه | الحالة: ${order.status}</p>
                            
                            <div style="margin-top: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                                <select onchange="assignDriver('${orderKey}', this.value)" style="flex: 1; margin-bottom: 0;">
                                    ${driverOptions}
                                </select>
                                <button type="button" class="danger-btn" onclick="deleteOrder('${orderKey}')">حذف الطلب</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            });
        }

        window.updateDeliveryFee = function(orderKey, subtotal) {
            let feeInput = document.getElementById('fee_' + orderKey).value;
            let fee = parseFloat(feeInput) || 0;
            let total = subtotal + fee;

            update(ref(db, 'adminOrders/' + orderKey), {
                deliveryFee: fee,
                total: total
            }).then(() => {
                alert('✅ تم تحديث قيمة التوصيل والإجمالي النهائي بنجاح!');
            });
        }

        window.assignDriver = function(orderKey, driverName) {
            if (!driverName) return;
            update(ref(db, 'adminOrders/' + orderKey), { driver: driverName, status: 'تم الإسناد للكابتن ' + driverName });
            alert('تم إسناد الطلب إلى الكابتن: ' + driverName);
        }

        window.deleteOrder = function(orderKey) {
            if (confirm('حذف هذا الطلب؟')) remove(ref(db, 'adminOrders/' + orderKey));
        }

        window.onload = function() {
            checkAdminSound();
            listenToDrivers();
            listenToMenu();
            listenToOrders();
        };
    </script>
</head>
<body>
    <div class="container">
        <h1>🛠️ لوحة إدارة منصة جاهز</h1>

        <div id="adminSoundDiv" class="sound-badge">
            <span style="color: #fbbf24;">⚠️ تفعيل تنبيهات الطلبات الجديدة (للمرة الأولى فقط)</span><br><br>
            <button type="button" style="background: #3b82f6; padding: 8px;" onclick="enableAdminSound()">🔊 تفعيل وحفظ صوت التنبيه للإدارة</button>
        </div>

        <div class="section">
            <h2>🍽️ إدارة الأقسام والمنتجات</h2>
            <input type="text" id="itemCategory" placeholder="اسم القسم (مثلاً: قسم المشويات)">
            <input type="text" id="categoryImage" placeholder="رابط صورة القسم (اختياري)">
            <input type="text" id="itemName" placeholder="اسم الصنف (مثلاً: سمك بلطي مشوي)">
            <input type="number" id="itemPrice" placeholder="السعر بالجنيه (مثلاً: 120)">
            <input type="text" id="itemImage" placeholder="رابط صورة المنتج (اختياري)">
            <button type="button" onclick="addMenuItem()">إضافة الصنف وقسمه للمنيو 🚀</button>
            <div id="adminMenuContainer" style="margin-top: 15px;"></div>
        </div>

        <div class="section">
            <h2>🚴 إدارة فريق الكباتن السحابي</h2>
            <input type="text" id="driverNameInput" placeholder="اسم الكابتن الجديد">
            <input type="text" id="driverPhoneInput" placeholder="رقم الهاتف">
            <button type="button" onclick="addDriver()">إضافة كابتن</button>
            <div id="driversListContainer" style="margin-top: 15px;"></div>
        </div>

        <div class="section">
            <h2>📦 طلبات العملاء وتتبع الخرائط (🔴 تحديث حي)</h2>
            <div id="adminOrdersList">جاري الاتصال...</div>
        </div>
    </div>
</body>
</html>
