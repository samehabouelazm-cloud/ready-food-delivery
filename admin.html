<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - جاهز في بلطيم</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 15px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
        h1 { color: #6366f1; font-size: 20px; }
        .btn { background: #22c55e; color: #fff; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; text-decoration: none; font-size: 13px; }
        
        .section-box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 25px; }
        h2 { color: #38bdf8; font-size: 17px; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        
        input { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 13px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
        
        .btn-add { background: #10b981; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-add:hover { background: #059669; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #334155; padding: 8px; text-align: center; }
        th { background: #334155; color: #38bdf8; }
        .badge { background: #3b82f6; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; }
        .btn-delete { background: #ef4444; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚙️ لوحة الإدارة والتحكم</h1>
        <a href="index.html" target="_blank" class="btn">🌐 فتح متجر العملاء</a>
    </header>

    <div class="section-box">
        <h2>📦 إضافة منتج جديد</h2>
        <form id="addProductForm" onsubmit="addNewProduct(event)">
            <div class="form-grid">
                <input type="text" id="prodName" placeholder="اسم المنتج" required>
                <input type="text" id="prodCat" placeholder="القسم" required>
                <input type="number" id="prodPrice" placeholder="السعر" required>
            </div>
            <input type="text" id="prodImage" placeholder="رابط صورة المنتج (URL)">
            <button type="submit" class="btn-add">➕ إضافة المنتج للمتجر</button>
        </form>
    </div>

    <div class="section-box">
        <h2>📋 المنتجات الحالية</h2>
        <table>
            <thead>
                <tr>
                    <th>الصورة</th>
                    <th>الاسم</th>
                    <th>القسم</th>
                    <th>السعر</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="adminProductsTable">
                <tr><td colspan="5" style="color: #94a3b8;">جاري التحميل...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="section-box">
        <h2>📥 طلبات العملاء الواردة</h2>
        <table>
            <thead>
                <tr>
                    <th>رقم الطلب</th>
                    <th>الوقت</th>
                    <th>العميل ورقم الهاتف</th>
                    <th>العنوان</th>
                    <th>الإجمالي</th>
                    <th>حالة الطلب</th>
                </tr>
            </thead>
            <tbody id="adminOrdersTable">
                <tr><td colspan="6" style="color: #94a3b8;">لا توجد طلبات جديدة.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    function loadAdminData() {
        let savedProducts = localStorage.getItem('storeProducts');
        let products = savedProducts ? JSON.parse(savedProducts) : [
            { "id": "1", "name": "كيلو طماطم طازجة", "category": "خضروات", "price": 15, "image": "https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=400" }
        ];

        let tbody = document.getElementById('adminProductsTable');
        tbody.innerHTML = '';
        products.forEach((p, index) => {
            tbody.innerHTML += `
                <tr>
                    <td><img src="${p.image}" style="width: 40px; height: 40px; object-fit: cover; border-radius: 4px;" onerror="this.src='https://via.placeholder.com/40'"></td>
                    <td><b>${p.name}</b></td>
                    <td><span class="badge">${p.category}</span></td>
                    <td>${p.price} ج.م</td>
                    <td><button class="btn-delete" onclick="deleteProduct(${index})">حذف</button></td>
                </tr>
            `;
        });

        loadOrders();
    }

    function addNewProduct(e) {
        e.preventDefault();
        let name = document.getElementById('prodName').value.trim();
        let cat = document.getElementById('prodCat').value.trim();
        let price = parseFloat(document.getElementById('prodPrice').value);
        let image = document.getElementById('prodImage').value.trim() || 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=400';

        let products = JSON.parse(localStorage.getItem('storeProducts')) || [];
        products.push({ id: Date.now().toString(), name, category: cat, price, image });
        localStorage.setItem('storeProducts', JSON.stringify(products));

        document.getElementById('addProductForm').reset();
        loadAdminData();
        alert('✅ تم إضافة المنتج بنجاح!');
    }

    function deleteProduct(index) {
        if (!confirm('هل أنت متأكد من الحذف؟')) return;
        let products = JSON.parse(localStorage.getItem('storeProducts')) || [];
        products.splice(index, 1);
        localStorage.setItem('storeProducts', JSON.stringify(products));
        loadAdminData();
    }

    function loadOrders() {
        let orders = JSON.parse(localStorage.getItem('storeOrders')) || [];
        let tbody = document.getElementById('adminOrdersTable');
        tbody.innerHTML = '';

        if (orders.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="color: #94a3b8;">لا توجد طلبات.</td></tr>`;
            return;
        }

        orders.forEach((o, index) => {
            let mapLink = o.coords ? `<br><a href="https://maps.google.com/?q=${o.coords.lat},${o.coords.lng}" target="_blank" style="color:#38bdf8;">📍 خريطة العميل</a>` : '';
            tbody.innerHTML += `
                <tr>
                    <td><b>#${o.id}</b></td>
                    <td>${o.date}</td>
                    <td><b>${o.customerName}</b><br>${o.customerPhone}</td>
                    <td>${o.customerAddress} ${mapLink}</td>
                    <td style="color: #34d399; font-weight: bold;">${o.total} ج.م</td>
                    <td>
                        <select onchange="updateStatus(${index}, this.value)" style="background:#0f172a; color:#fff; padding:4px;">
                            <option value="تم استلام الطلب من الإدارة وجاري التحضير" ${o.trackingStatus.includes('استلام') ? 'selected' : ''}>جاري التحضير</option>
                            <option value="الطلب استلمه المندوب" ${o.trackingStatus.includes('المندوب') ? 'selected' : ''}>استلمه المندوب</option>
                            <option value="المندوب في الطريق إليك" ${o.trackingStatus.includes('الطريق') ? 'selected' : ''}>المندوب بالطريق</option>
                            <option value="تم تسليم الطلب بنجاح" ${o.trackingStatus.includes('تسليم') ? 'selected' : ''}>تم التسليم</option>
                        </select>
                    </td>
                </tr>
            `;
        });
    }

    function updateStatus(index, val) {
        let orders = JSON.parse(localStorage.getItem('storeOrders')) || [];
        if (orders[index]) {
            orders[index].trackingStatus = val;
            localStorage.setItem('storeOrders', JSON.stringify(orders));
            alert('✅ تم تحديث حالة الطلب للعميل!');
        }
    }

    window.onload = loadAdminData;
</script>
</body>
</html>
