<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة المطعم - جاهز</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; padding: 20px; direction: rtl; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1, h2 { color: #f59e0b; }
        .section { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
        input, select { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #334155; background: #1e293b; color: #fff; box-sizing: border-box; }
        button { cursor: pointer; font-weight: bold; border: none; border-radius: 5px; padding: 10px 15px; background: #22c55e; color: #fff; }
        .order-card { background: #1e293b; padding: 15px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #475569; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛠️ لوحة إدارة المطعم</h1>

        <!-- قسم إضافة أصناف للمنيو -->
        <div class="section">
            <h2>إضافة صنف جديد للمنيو</h2>
            <input type="text" id="itemName" placeholder="اسم الوجبة أو الصنف">
            <input type="number" id="itemPrice" placeholder="السعر بالجنيه">
            <button type="button" onclick="addMenuItem()">إضافة الصنف لعرضه للعملاء</button>
        </div>

        <!-- قسم متابعة طلبات العملاء وإسناد الكباتن -->
        <div class="section">
            <h2>📦 طلبات العملاء الواردة</h2>
            <div id="adminOrdersList">لا توجد طلبات واردة حالياً.</div>
        </div>
    </div>

    <script>
        function addMenuItem() {
            const name = document.getElementById('itemName').value.trim();
            const price = document.getElementById('itemPrice').value.trim();

            if (!name || !price) {
                alert('الرجاء إدخال اسم الصنف والسعر!');
                return;
            }

            let menu = JSON.parse(localStorage.getItem('jahez_menu')) || [];
            menu.push({ name, price: Number(price) });
            localStorage.setItem('jahez_menu', JSON.stringify(menu));

            alert(`تمت إضافة الصنف (${name}) بنجاح وسيظهر فوراً في صفحة العميل!`);
            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
        }

        function loadAdminOrders() {
            const container = document.getElementById('adminOrdersList');
            let orders = JSON.parse(localStorage.getItem('jahez_orders')) || [];

            if (orders.length === 0) {
                container.innerHTML = 'لا توجد طلبات واردة حالياً.';
                return;
            }

            let html = '';
            orders.forEach(order => {
                let itemsText = order.items.map(i => `${i.name} (×${i.quantity})`).join(', ');
                html += `
                    <div class="order-card">
                        <h3 style="color: #f59e0b; margin-top: 0;">طلب #${order.id}</h3>
                        <p><strong>العميل:</strong> ${order.customerName} | <strong>الهاتف:</strong> ${order.phone}</p>
                        <p><strong>العنوان:</strong> ${order.address}</p>
                        <p><strong>الأصناف:</strong> ${itemsText}</p>
                        <div style="margin-top: 10px;">
                            <label><strong>إسناد إلى كابتن:</strong></label>
                            <select onchange="assignDriver('${order.id}', this.value)">
                                <option value="">اختر الكابتن</option>
                                <option value="كابتن أحمد" ${order.driver === 'كابتن أحمد' ? 'selected' : ''}>كابتن أحمد</option>
                                <option value="كابتن محمود" ${order.driver === 'كابتن محمود' ? 'selected' : ''}>كابتن محمود</option>
                                <option value="كابتن إبراهيم" ${order.driver === 'كابتن إبراهيم' ? 'selected' : ''}>كابتن إبراهيم</option>
                            </select>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function assignDriver(orderId, driverName) {
            if (!driverName) return;
            let orders = JSON.parse(localStorage.getItem('jahez_orders')) || [];
            let order = orders.find(o => o.id == orderId);
            if (order) {
                order.driver = driverName;
                localStorage.setItem('jahez_orders', JSON.stringify(orders));
                alert(`تم إسناد الطلب #${orderId} إلى (${driverName}) بنجاح وثبات!`);
            }
        }

        window.onload = loadAdminOrders;
    </script>
</body>
</html>
