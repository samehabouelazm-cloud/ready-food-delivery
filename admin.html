<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم والإدارة - جاهز</title>
    <script>
        let pass = prompt("الرجاء إدخال كلمة سر لوحة التحكم:");
        if (pass !== "Ss@1234567890") {
            alert("كلمة المرور غير صحيحة!");
            window.location.href = "index.html";
        }
    </script>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: Tahoma, sans-serif; padding: 20px; direction: rtl; text-align: right; }
        .box { background: #1e293b; padding: 20px; border-radius: 10px; max-width: 600px; margin: 50px auto; border: 1px solid #334155; }
        h1 { color: #38bdf8; font-size: 22px; margin-bottom: 15px; }
        a { color: #34d399; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h1>⚙️ مرحباً بك في لوحة الإدارة المحمية</h1>
        <p>تم التحقق بنجاح.</p>
        <br>
        <a href="index.html">⬅ العودة للمتجر الرئيسي</a>
    </div>
</body>
</html>
