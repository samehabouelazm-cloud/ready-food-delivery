<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة المنصة والطلبات - جاهز</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; padding: 20px; direction: rtl; }
        .container { max-width: 850px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1, h2 { color: #f59e0b; text-align: center; }
        .section { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
        input, select { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #334155; background: #1e293b; color: #fff; box-sizing: border-box; }
        button { cursor: pointer; font-weight: bold; border: none; border-radius: 5px; padding: 10px 15px; background: #22c55e; color: #fff; }
        .danger-btn { background: #ef4444; color: #fff; padding: 5px 10px; font-size: 12px; }
        .order-card { background: #1e293b; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #475569; }
        .driver-row { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 8px 12px; border-radius: 5px; margin-bottom: 8px; border: 1px solid #475569; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛠️ لوحة إدارة منصة جاهز في بلطيم</h1>

        <!-- قسم إدارة الكباتن (إضافة وحذف) -->
        <div class="section">
            <h2>🚴 إدارة فريق الكباتن</h2>
            <input type="text" id="driverNameInput" placeholder="اسم الكابتن الجديد">
            <input type="text" id="driverPhoneInput" placeholder="رقم الهاتف">
            <button type="button" onclick="addDriver()">إضافة كابتن جديد</button>
            
            <div id="driversListContainer" style="margin-top: 15px;">
                <!-- سيتم عرض الكباتن المسجلين هنا -->
            </div>
        </div>

        <!-- قسم متابعة طلبات العملاء الواردة -->
        <div class="section">
            <h2>📦 طلبات العملاء الواردة (تحديث تلقائي)</h2>
            <div style="margin-bottom: 10px;">
                <button type="button" onclick="loadAdminOrders()" style="background: #3b82f6; font-size: 14px; padding: 6px 12px;">🔄 تحديث الطلبات الآن</button>
            </div>
            <div id="adminOrdersList">جاري تحميل الطلبات الواردة...</div>
        </div>
    </div>

    <script>
        // دالة جلب الكباتن
        function getDrivers() {
            return JSON.parse(localStorage.getItem('jahez_drivers')) || [
                { name: 'كابتن أحمد', phone: '01012345678' },
                { name: 'كابتن محمود', phone: '01112345678' }
            ];
        }

        // عرض قائمة الكباتن مع إمكانية الحذف
        function renderDriversList() {
            let drivers = getDrivers();
            const container = document.getElementById('driversListContainer');
            if (drivers.length === 0) {
                container.innerHTML = '<p style="color: #94a3b8;">لا يوجد كباتن مسجلين حالياً.</p>';
                return;
            }
            let html = '<p><strong>الكباتن المتاحون:</strong></p>';
            drivers.forEach((d, index) => {
                html += `
                    <div class="driver-row">
                        <span>🚴‍♂️ ${d.name} (${d.phone})</span>
                        <button type="button" class="danger-btn" onclick="deleteDriver(${index})">حذف</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // إضافة كابتن جديد
        function addDriver() {
            const name = document.getElementById('driverNameInput').value.trim();
            const phone = document.getElementById('driverPhoneInput').value.trim();
            if (!name || !phone) {
                alert('الرجاء إدخال اسم ورقم هاتفك الكابتن!');
                return;
            }
            let drivers = getDrivers();
            drivers.push({ name, phone });
            localStorage.setItem('jahez_drivers', JSON.stringify(drivers));
            document.getElementById('driverNameInput').value = '';
            document.getElementById('driverPhoneInput').value = '';
            renderDriversList();
            loadAdminOrders();
            alert(`تمت إضافة الكابتن (${name}) بنجاح!`);
        }

        // حذف كابتن
        function deleteDriver(index) {
            let drivers = getDrivers();
            drivers.splice(index, 1);
            localStorage.setItem('jahez_drivers', JSON.stringify(drivers));
            renderDriversList();
            loadAdminOrders();
            alert('تم حذف الكابتن بنجاح.');
        }

        // تحميل طلبات العملاء الواردة من adminOrders (المرتبطة بـ index.html)
        function loadAdminOrders() {
            const container = document.getElementById('adminOrdersList');
            let orders = JSON.parse(localStorage.getItem('adminOrders')) || [];
            let drivers = getDrivers();

            if (orders.length === 0) {
                container.innerHTML = '<p style="color: #94a3b8; text-align: center;">لا توجد طلبات واردة من العملاء حتى الآن.</p>';
                return;
            }

            let html = '';
            orders.forEach((order, index) => {
                let itemsText = order.items.map(i => `${i.name} (x${i.quantity})`).join(', ');
                let currentDriver = order.driver || '';

                let driverOptions = `<option value="">اختر الكابتن للإسناد</option>`;
                drivers.forEach(d => {
                    driverOptions += `<option value="${d.name}" ${currentDriver === d.name ? 'selected' : ''}>${d.name}</option>`;
                });

                html += `
                    <div class="order-card">
                        <h3 style="color: #f59e0b; margin-top: 0;">طلب #${order.id} - ${order.time}</h3>
                        <p><strong>اسم العميل:</strong> ${order.customerName}</p>
                        <p><strong>العنوان بالتفصيل:</strong> ${order.address}</p>
                        <p><strong>طريقة الدفع:</strong> <span style="color: #38bdf8; font-weight: bold;">${order.paymentMethod}</span></p>
                        <p><strong>الأصناف المطلوبة:</strong> ${itemsText}</p>
                        <p style="color: #22c55e; font-weight: bold;">الإجمالي: ${order.total} جنيه | الحالة: ${order.status}</p>
                        
                        <div style="margin-top: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                            <select onchange="assignDriver(${index}, this.value)" style="flex: 1; margin-bottom: 0;">
                                ${driverOptions}
                            </select>
                            <button type="button" style="background: #8b5cf6;" onclick="autoAssignDriver(${index})">⚡ إسناد أتوماتيك</button>
                            <button type="button" class="danger-btn" onclick="deleteOrder(${index})">حذف الطلب</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // الإسناد التلقائي للكابتن
        function autoAssignDriver(orderIndex) {
            let drivers = getDrivers();
            if (drivers.length === 0) {
                alert('لا توجد كباتن متاحين للإسناد التلقائي! أضف كابتن أولاً.');
                return;
            }
            let randomDriver = drivers[Math.floor(Math.random() * drivers.length)].name;
            assignDriver(orderIndex, randomDriver);
            alert(`تم إسناد الطلب أتوماتيكياً إلى: (${randomDriver}) بنجاح!`);
        }

        // إسناد الطلب لكابتن معين وحفظه
        function assignDriver(orderIndex, driverName) {
            if (!driverName) return;
            let orders = JSON.parse(localStorage.getItem('adminOrders')) || [];
            if (orders[orderIndex]) {
                orders[orderIndex].driver = driverName;
                orders[orderIndex].status = 'تم الإسناد للكابتن ' + driverName;
                localStorage.setItem('adminOrders', JSON.stringify(orders));
                loadAdminOrders();
            }
        }

        // حذف طلب من القائمة
        function deleteOrder(orderIndex) {
            if (confirm('هل أنت متأكد من حذف هذا الطلب؟')) {
                let orders = JSON.parse(localStorage.getItem('adminOrders')) || [];
                orders.splice(orderIndex, 1);
                localStorage.setItem('adminOrders', JSON.stringify(orders));
                loadAdminOrders();
            }
        }

        // عند فتح الصفحة يتم تحميل البيانات وكباتن التوصيل
        window.onload = function() {
            renderDriversList();
            loadAdminOrders();
        };
    </script>
</body>
</html>
