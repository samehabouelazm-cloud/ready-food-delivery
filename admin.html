<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة المتجر</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1 { color: #f59e0b; text-align: center; margin-bottom: 20px; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #cbd5e1; font-size: 14px; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; }
        button { background: #22c55e; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #16a34a; }
        .preview { margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 8px; }
        .preview h3 { color: #38bdf8; margin-bottom: 10px; }
        ul { list-style: none; }
        li { background: #1e293b; padding: 8px; margin-bottom: 5px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { background: #ef4444; padding: 4px 8px; font-size: 12px; width: auto; margin: 0; }
        .link-store { display: block; text-align: center; margin-top: 15px; color: #f59e0b; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>⚙️ لوحة تحكم المتجر</h1>
    
    <div class="form-group">
        <label>اسم القسم (مثل: المشويات، الأجبان):</label>
        <input type="text" id="catName" placeholder="أدخل اسم القسم">
    </div>

    <div class="form-group">
        <label>اسم المنتج (مثل: سمك بلطي مشوي):</label>
        <input type="text" id="prodName" placeholder="أدخل اسم المنتج">
    </div>

    <div class="form-group">
        <label>السعر بالجنيه:</label>
        <input type="number" id="prodPrice" placeholder="أدخل السعر (مثل: 100)">
    </div>

    <div class="form-group">
        <label>رابط صورة المنتج (رابط مباشر للصورة):</label>
        <input type="text" id="prodImg" placeholder="https://example.com/image.jpg">
    </div>

    <button onclick="addProduct()">إضافة المنتج للمتجر 🚀</button>

    <a href="index.html" class="link-store">🔗 عرض متجر العملاء</a>

    <div class="preview">
        <h3>📦 المنتجات المضافة حالياً:</h3>
        <ul id="productsList"></ul>
    </div>
</div>

<script>
    function getProducts() {
        return JSON.parse(localStorage.getItem('storeProducts')) || [];
    }

    function saveProducts(products) {
        localStorage.setItem('storeProducts', JSON.stringify(products));
    }

    function renderAdminList() {
        const products = getProducts();
        const list = document.getElementById('productsList');
        list.innerHTML = '';
        
        if (products.length === 0) {
            list.innerHTML = '<li style="color:#94a3b8; text-align:center;">لا توجد منتجات مضافة بعد.</li>';
            return;
        }

        products.forEach((p, index) => {
            list.innerHTML += `
                <li>
                    <span><b>[${p.category}]</b> ${p.name} - ${p.price} ج.م</span>
                    <button class="delete-btn" onclick="deleteProduct(${index})">حذف</button>
                </li>
            `;
        });
    }

    function addProduct() {
        const category = document.getElementById('catName').value.trim();
        const name = document.getElementById('prodName').value.trim();
        const price = document.getElementById('prodPrice').value.trim();
        const image = document.getElementById('prodImg').value.trim() || 'https://images.unsplash.com/photo-1544025162-d76694265947?w=500';

        if (!category || !name || !price) {
            alert('من فضلك املأ (الاسم، القسم، والسعر) على الأقل!');
            return;
        }

        let products = getProducts();
        products.push({ category, name, price, image });
        saveProducts(products);

        document.getElementById('prodName').value = '';
        document.getElementById('prodPrice').value = '';
        document.getElementById('prodImg').value = '';
        
        renderAdminList();
        alert('تمت إضافة المنتج بنجاح وسيعرض فوراً للعملاء!');
    }

    function deleteProduct(index) {
        let products = getProducts();
        products.splice(index, 1);
        saveProducts(products);
        renderAdminList();
    }

    window.onload = renderAdminList;
</script>

</body>
</html>
