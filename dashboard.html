<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم والإدارة - جاهز</title>
    <script>
        let pass = prompt("الرجاء إدخال كلمة سر لوحة التحكم:");
        if (pass !== "Ss@1234567890") {
            alert("كلمة المرور غير صحيحة!");
            window.location.href = "index.html";
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; direction: rtl; text-align: right; }
        .container { max-width: 1100px; margin: 0 auto; background: #1e293b; border: 2px dashed #6366f1; border-radius: 12px; padding: 20px; }
        h1 { color: #38bdf8; font-size: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        input, select { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        .btn { background: #10b981; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; font-size: 15px; }
        .btn:hover { background: #059669; }
        .btn-cancel { background: #64748b; display: none; }
        .sync-btn { background: #3b82f6; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px; }
        th, td { border: 1px solid #334155; padding: 10px; text-align: center; vertical-align: middle; }
        th { background: #334155; color: #38bdf8; }
        .back-btn { background: #3b82f6; color: #fff; padding: 10px 18px; border-radius: 6px; text-decoration: none; display: inline-block; margin-top: 15px; font-weight: bold; }
        .info-box { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; font-size: 13px; color: #38bdf8; line-height: 1.6; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; background: #0284c7; color: #fff; font-size: 11px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span>🛠️ لوحة تحكم وإدارة المنتجات (جاهز)</span>
            <button class="sync-btn" onclick="loadAdminProducts()">🔄 تحديث القائمة</button>
        </h1>
        
        <div class="info-box">
            🌐 <strong>مزامنة حية لجميع الأجهزة:</strong> أي تعديل، إضافة، أو رفع صورة من جهازك سيتم حفظه مباشرة في السحابة ليظهر عند كافة العملاء فوراً.
        </div>

        <div style="background: #0f172a; padding: 15px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #334155;">
            <h3 id="formTitle" style="color: #38bdf8; margin-bottom: 12px;">إضافة منتج جديد:</h3>
            <input type="hidden" id="editIndex" value="-1">
            
            <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px;">اسم المنتج:</label>
            <input type="text" id="pName" placeholder="مثال: بيض بلدي، لابتوب MSI">

            <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px;">السعر (بالجنيه):</label>
            <input type="number" id="pPrice" placeholder="مثال: 150">

            <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px;">القسم / التصنيف:</label>
            <select id="pCategory">
                <option value="سوبر ماركت">🛒 سوبر ماركت ومواد غذائية</option>
                <option value="إلكترونيات">📱 إلكترونيات وأجهزة ذكية</option>
                <option value="وجبات سريعة">🍔 وجبات سريعة ومطاعم</option>
                <option value="مشروبات">🥤 مشروبات ومشروبات ساخنة</option>
                <option value="حلويات">🍰 حلويات ومخبوزات</option>
                <option value="أدوات منزلية">🏠 أدوات ومستلزمات منزلية</option>
                <option value="موضة وأزياء">👕 موضة وأزياء</option>
                <option value="عام">📦 قسم عام</option>
            </select>

            <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px;">اختر صورة المنتج (من الموبايل أو الكمبيوتر مباشرة):</label>
            <input type="file" id="pImageFile" accept="image/*" style="padding: 7px;">

            <button class="btn" id="saveBtn" onclick="saveProduct()">حفظ ونشر التعديلات للسحابة 🚀</button>
            <button class="btn btn-cancel" id="cancelBtn" onclick="resetForm()">إلغاء التعديل</button>
        </div>

        <h3>قائمة المنتجات الحالية في السحابة</h3>
        <table>
            <thead>
                <tr>
                    <th>الصورة</th>
                    <th>اسم المنتج</th>
                    <th>السعر</th>
                    <th>القسم</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody id="adminProductsList"></tbody>
        </table>
        <a href="index.html" class="back-btn">العودة إلى واجهة المتجر الرئيسية 🏪</a>
    </div>

    <script>
        const API_URL = "https://api.npoint.io/43ccf89dee421e821c9e";
        let currentAdminProducts = [];

        async function loadAdminProducts() {
            let tbody = document.getElementById('adminProductsList');
            tbody.innerHTML = '<tr><td colspan="5" style="color:#94a3b8;">جاري جلب المنتجات من السحابة... ⏳</td></tr>';

            try {
                let res = await fetch(API_URL + "?t=" + new Date().getTime());
                if (res.ok) {
                    currentAdminProducts = await res.json();
                } else {
                    currentAdminProducts = [];
                }
            } catch(e) {
                currentAdminProducts = [];
            }
            renderAdminTable();
        }

        function renderAdminTable() {
            let tbody = document.getElementById('adminProductsList');
            tbody.innerHTML = '';
            
            if (!currentAdminProducts || currentAdminProducts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="color:#94a3b8;">لا توجد منتجات مضافة حالياً.</td></tr>';
                return;
            }

            currentAdminProducts.forEach((p, index) => {
                let imgSrc = p.image || p.img || 'https://via.placeholder.com/50';
                tbody.innerHTML += `<tr>
                    <td><img src="${imgSrc}" width="40" height="40" style="border-radius:6px; object-fit: cover;" onerror="this.src='https://via.placeholder.com/50'"></td>
                    <td><b>${p.name}</b></td>
                    <td style="color:#10b981; font-weight:bold;">${p.price} ج.م</td>
                    <td><span class="badge">${p.category || 'عام'}</span></td>
                    <td>
                        <button onclick="editProduct(${index})" style="background:#3b82f6; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; font-weight:bold; margin-left:5px;">تعديل ✏️</button>
                        <button onclick="deleteProduct(${index})" style="background:#ef4444; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; font-weight:bold;">حذف 🗑️</button>
                    </td>
                </tr>`;
            });
        }

        function saveProduct() {
            let name = document.getElementById('pName').value.trim();
            let price = parseFloat(document.getElementById('pPrice').value);
            let cat = document.getElementById('pCategory').value;
            let fileInput = document.getElementById('pImageFile');
            let editIndex = parseInt(document.getElementById('editIndex').value);

            if (!name || isNaN(price)) { 
                alert('الرجاء إدخال اسم المنتج والسعر بشكل صحيح!'); 
                return; 
            }

            let btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerText = 'جاري معالجة الصورة والرفع للسحابة... ⏳';

            if (fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    let base64Image = e.target.result;
                    processSaving(name, price, cat, base64Image, editIndex);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                let existingImage = (editIndex > -1) ? (currentAdminProducts[editIndex].image || currentAdminProducts[editIndex].img) : 'https://via.placeholder.com/260x160';
                processSaving(name, price, cat, existingImage, editIndex);
            }
        }

        async function processSaving(name, price, cat, imgSrc, editIndex) {
            let productData = {
                name: name,
                price: price,
                image: imgSrc,
                img: imgSrc,
                category: cat
            };

            if (editIndex > -1) {
                currentAdminProducts[editIndex] = productData;
            } else {
                currentAdminProducts.push(productData);
            }

            await updateCloud(currentAdminProducts);
            resetForm();
            loadAdminProducts();
        }

        function editProduct(index) {
            let p = currentAdminProducts[index];
            document.getElementById('pName').value = p.name;
            document.getElementById('pPrice').value = p.price;
            document.getElementById('pCategory').value = p.category || 'عام';
            document.getElementById('editIndex').value = index;
            
            document.getElementById('formTitle').innerText = 'تعديل المنتج المحدد:';
            document.getElementById('saveBtn').innerText = 'تحديث وحفظ التعديلات 💾';
            document.getElementById('cancelBtn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pImageFile').value = '';
            document.getElementById('editIndex').value = '-1';
            document.getElementById('formTitle').innerText = 'إضافة منتج جديد:';
            document.getElementById('saveBtn').innerText = 'حفظ ونشر التعديلات للسحابة 🚀';
            document.getElementById('saveBtn').disabled = false;
            document.getElementById('cancelBtn').style.display = 'none';
        }

        async function deleteProduct(index) {
            if(!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;
            currentAdminProducts.splice(index, 1);
            await updateCloud(currentAdminProducts);
            loadAdminProducts();
        }

        async function updateCloud(data) {
            try {
                let res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if(res.ok) {
                    alert('✅ تمت المزامنة بنجاح! التحديثات أصبحت متاحة لجميع العملاء.');
                } else {
                    alert('خطأ في حفظ البيانات بالسحابة!');
                }
            } catch(e) {
                alert('فشل الاتصال بالإنترنت أو السحابة!');
            }
        }

        window.onload = loadAdminProducts;
    </script>
</body>
</html>
