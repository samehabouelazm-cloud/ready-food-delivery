<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم والإدارة - جاهز</title>
    <script>
        let pass = prompt("الرجاء إدخال كلمة سر لوحة التحكم:");
        if (pass !== "Ss@1234567890") {
            alert("كلمة المرور غير صحيحة!");
            window.location.href = "index.html";
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; direction: rtl; text-align: right; }
        .container { max-width: 1000px; margin: 0 auto; background: #1e293b; border: 2px dashed #6366f1; border-radius: 12px; padding: 20px; }
        h1 { color: #38bdf8; font-size: 20px; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        .btn { background: #10b981; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 20px; }
        .btn:hover { background: #059669; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px; }
        th, td { border: 1px solid #334155; padding: 8px; text-align: center; }
        th { background: #334155; color: #38bdf8; }
        .back-btn { background: #3b82f6; color: #fff; padding: 8px 15px; border-radius: 6px; text-decoration: none; display: inline-block; margin-top: 15px; font-weight: bold; }
        .status-box { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>لوحة تحكم المتجر (إدارة المنتجات والطلبات)</h1>
        
        <div class="status-box">
            <label style="color: #38bdf8; display: block; margin-bottom: 5px; font-weight: bold;">معرف السحابة الموحد (Bin ID):</label>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="text" id="binIdInput" placeholder="أدخل Bin ID الخاص بك" style="margin-bottom:0; flex-grow: 1;">
                <button onclick="saveBinId()" style="background: #3b82f6; color: #fff; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold;">حفظ الـ ID للمزامنة</button>
            </div>
            <p style="color: #94a3b8; font-size: 11px; margin-top: 8px;">* تأكد من وضع نفس الـ Bin ID في واجهة المتجر الرئيسية لرؤية التحديثات على الجوال فوراً.</p>
        </div>

        <div style="margin-bottom: 20px;">
            <h3>إضافة منتج جديد (متزامن سحابياً)</h3>
            <input type="text" id="pName" placeholder="اسم المنتج">
            <input type="number" id="pPrice" placeholder="السعر (بالجنيه)">
            <input type="text" id="pImg" placeholder="رابط صورة المنتج (اختياري)">
            <button class="btn" id="addBtn" onclick="addProduct()">إضافة المنتج أونلاين 🚀</button>
        </div>

        <h3>قائمة المنتجات الحالية</h3>
        <table>
            <thead>
                <tr>
                    <th>الصورة</th>
                    <th>اسم المنتج</th>
                    <th>السعر</th>
                    <th>الإجراء</th>
                </tr>
            </thead>
            <tbody id="adminProductsList"></tbody>
        </table>
        <a href="index.html" class="back-btn">العودة إلى واجهة المتجر الرئيسية</a>
    </div>

    <script>
        const MASTER_KEY = "$2a$10$rfoY9cg5fqWgPrYIVhQTeOXvgZocLt3Bq2Mhxbo5a3Wkqx5ZvQmBW";
        const DEFAULT_BIN_ID = "6acd38dffd5d160536539d2"; 
        let currentAdminProducts = [];

        function getBinId() {
            return localStorage.getItem('jsonbin_id') || DEFAULT_BIN_ID;
        }

        function saveBinId() {
            let id = document.getElementById('binIdInput').value.trim();
            if(!id) { alert('الرجاء إدخال Bin ID صحيح!'); return; }
            localStorage.setItem('jsonbin_id', id);
            alert('✅ تم حفظ معرف الربط بنجاح! جاري جلب البيانات السحابية...');
            loadAdminProducts();
        }

        async function loadAdminProducts() {
            let binId = getBinId();
            document.getElementById('binIdInput').value = binId;
            let tbody = document.getElementById('adminProductsList');
            
            tbody.innerHTML = '<tr><td colspan="4" style="color:#94a3b8;">جاري جلب المنتجات من السحابة...</td></tr>';

            try {
                let response = await fetch('https://api.jsonbin.io/v3/b/' + binId + '/latest', {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                if (response.ok) {
                    let resData = await response.json();
                    currentAdminProducts = resData.record || [];
                    localStorage.setItem('storeProducts', JSON.stringify(currentAdminProducts));
                } else {
                    throw new Error("لم نتمكن من الجلب");
                }
            } catch (e) {
                currentAdminProducts = JSON.parse(localStorage.getItem('storeProducts')) || [];
            }

            renderAdminTable();
        }

        function renderAdminTable() {
            let tbody = document.getElementById('adminProductsList');
            tbody.innerHTML = '';
            
            if (!currentAdminProducts || currentAdminProducts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="color:#94a3b8;">لا توجد منتجات مضافة حالياً.</td></tr>';
                return;
            }

            currentAdminProducts.forEach((p, index) => {
                let imgSrc = p.image || p.img || 'https://via.placeholder.com/50';
                tbody.innerHTML += '<tr>' +
                    '<td><img src="' + imgSrc + '" width="40" height="40" style="border-radius:4px; object-fit: cover;" onerror="this.src=\'https://via.placeholder.com/50\'"></td>' +
                    '<td>' + p.name + '</td>' +
                    '<td>' + p.price + ' ج.م</td>' +
                    '<td><button onclick="deleteProduct(' + index + ')" style="background:#ef4444; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">حذف</button></td>' +
                '</tr>';
            });
        }

        async function addProduct() {
            let name = document.getElementById('pName').value.trim();
            let price = parseFloat(document.getElementById('pPrice').value);
            let img = document.getElementById('pImg').value.trim();

            if (!name || isNaN(price)) { 
                alert('الرجاء إدخال اسم المنتج والسعر بشكل صحيح!'); 
                return; 
            }

            let btn = document.getElementById('addBtn');
            btn.disabled = true;
            btn.innerText = 'جاري الحفظ في السحابة... ⏳';

            currentAdminProducts.push({
                name: name,
                price: price,
                image: img || 'https://via.placeholder.com/200',
                img: img || 'https://via.placeholder.com/200',
                category: "عام"
            });

            await saveToCloud(currentAdminProducts);

            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pImg').value = '';
            
            btn.disabled = false;
            btn.innerText = 'إضافة المنتج أونلاين 🚀';
            renderAdminTable();
        }

        async function deleteProduct(index) {
            if(!confirm('هل أنت تأكد من حذف هذا المنتج؟')) return;
            currentAdminProducts.splice(index, 1);
            await saveToCloud(currentAdminProducts);
            renderAdminTable();
        }

        async function saveToCloud(data) {
            let binId = getBinId();
            try {
                // المحاولة الأولى عبر PUT لتعديل الـ Bin الموحد المربوط للجوال
                let response = await fetch('https://api.jsonbin.io/v3/b/' + binId, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(data)
                });
                
                if(response.ok) {
                    localStorage.setItem('storeProducts', JSON.stringify(data));
                    alert('🌐 تمت الإضافة والمزامنة السحابية بنجاح! ستشاهد المنتج فوراً عند تحديث الجوال.');
                } else {
                    // في حال تفعيل الخصوصية الشديدة يتم الإنشاء تلقائياً لـ Bin جديد لتفادي العطل
                    let postResp = await fetch('https://api.jsonbin.io/v3/b', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': MASTER_KEY,
                            'X-Bin-Name': 'ReadyStoreData'
                        },
                        body: JSON.stringify(data)
                    });
                    if(postResp.ok) {
                        let resData = await postResp.json();
                        let newId = resData.metadata.id;
                        localStorage.setItem('jsonbin_id', newId);
                        document.getElementById('binIdInput').value = newId;
                        localStorage.setItem('storeProducts', JSON.stringify(data));
                        alert('🌐 تم تحديث السحابة بـ Bin جديد بنجاح!\nبرجاء التأكد من استخدام الـ Bin ID الجديد: ' + newId);
                    } else {
                        alert('حدث خطأ أثناء الاتصال بالسحابة!');
                    }
                }
            } catch(err) {
                console.error(err);
                alert('خطأ في شبكة الاتصال بالسحابة!');
            }
        }

        window.onload = loadAdminProducts;
    </script>
</body>
</html>
