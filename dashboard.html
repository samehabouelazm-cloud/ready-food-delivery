<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم والإدارة</title>
    <script>
        let pass = prompt("الرجاء إدخال كلمة سر لوحة التحكم:");
        if (pass !== "Ss@1234567890") {
            alert("كلمة المرور غير صحيحة!");
            window.location.href = "index.html";
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; direction: rtl; text-align: right; }
        .container { max-width: 1000px; margin: 0 auto; background: #1e293b; border: 2px dashed #6366f1; border-radius: 12px; padding: 20px; }
        h1 { color: #38bdf8; font-size: 20px; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        .btn { background: #10b981; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 20px; }
        .btn:hover { background: #059669; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px; }
        th, td { border: 1px solid #334155; padding: 8px; text-align: center; }
        th { background: #334155; color: #38bdf8; }
        .back-btn { background: #3b82f6; color: #fff; padding: 8px 15px; border-radius: 6px; text-decoration: none; display: inline-block; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>لوحة تحكم المتجر (إدارة المنتجات والطلبات)</h1>
        
        <div style="background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155;">
            <label style="font-size: 13px; color: #38bdf8; display: block; margin-bottom: 5px;">إعدادات السحابة (JSONBin):</label>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="text" id="binIdInput" placeholder="أدخل Bin ID موجود، أو اضغط إنشاء تلقائي مباشرة" style="margin-bottom:0; flex-grow: 1;">
                <button onclick="saveBinId()" style="background: #3b82f6; color: #fff; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold;">حفظ الـ ID</button>
                <button onclick="createBinAutomatically()" style="background: #8b5cf6; color: #fff; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold;">✨ إنشاء Bin جديد تلقائياً</button>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <h3>إضافة منتج جديد (سحابياً)</h3>
            <input type="text" id="pName" placeholder="اسم المنتج">
            <input type="number" id="pPrice" placeholder="السعر">
            <input type="text" id="pImg" placeholder="رابط صورة المنتج">
            <button class="btn" onclick="addProduct()">إضافة المنتج أونلاين 🚀</button>
        </div>

        <h3>قائمة المنتجات الحالية</h3>
        <table>
            <thead>
                <tr>
                    <th>الصورة</th>
                    <th>اسم المنتج</th>
                    <th>السعر</th>
                    <th>الإجراء</th>
                </tr>
            </thead>
            <tbody id="adminProductsList"></tbody>
        </table>
        <a href="index.html" class="back-btn">العودة إلى واجهة المتجر الرئيسية</a>
    </div>

    <script>
        const MASTER_KEY = "$2a$10$rfoY9cg5fqWgPrYIVhQTeOXvgZocLt3Bq2Mhxbo5a3Wkqx5ZvQmBW";
        let currentAdminProducts = [];

        function getBinId() {
            return localStorage.getItem('jsonbin_id') || "";
        }

        function saveBinId() {
            let id = document.getElementById('binIdInput').value.trim();
            if(!id) { alert('الرجاء إدخال Bin ID صحيح!'); return; }
            localStorage.setItem('jsonbin_id', id);
            alert('تم حفظ الربط بنجاح! جاري تحميل البيانات...');
            loadAdminProducts();
        }

        async function createBinAutomatically() {
            try {
                let response = await fetch('https://api.jsonbin.io/v3/b', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY,
                        'X-Bin-Name': 'ReadyStoreProducts'
                    },
                    body: JSON.stringify([
                        {
                            name: "منتج تجريبي أولي",
                            price: 15,
                            category: "عام",
                            image: "https://via.placeholder.com/200"
                        }
                    ])
                });

                if (response.ok) {
                    let data = await response.json();
                    let newBinId = data.metadata.id;
                    localStorage.setItem('jsonbin_id', newBinId);
                    document.getElementById('binIdInput').value = newBinId;
                    alert('🎉 تم إنشاء الـ Bin الجديد وحفظه أونلاين بنجاح!\nBin ID: ' + newBinId);
                    loadAdminProducts();
                } else {
                    alert('فشل إنشاء الـ Bin تلقائياً!');
                }
            } catch (err) {
                alert('حدث خطأ أثناء الاتصال بـ JSONBin!');
            }
        }

        async function loadAdminProducts() {
            let binId = getBinId();
            document.getElementById('binIdInput').value = binId;
            let tbody = document.getElementById('adminProductsList');
            
            if(!binId) {
                tbody.innerHTML = '<tr><td colspan="4" style="color:#f59e0b;">الرجاء الضغط على زر "✨ إنشاء Bin جديد تلقائياً" بالأعلى لربط المتجر فوراً.</td></tr>';
                return;
            }

            tbody.innerHTML = '<tr><td colspan="4" style="color:#94a3b8;">جاري جلب المنتجات من السحابة...</td></tr>';

            try {
                let response = await fetch('https://api.jsonbin.io/v3/b/' + binId + '/latest', {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                if (response.ok) {
                    let resData = await response.json();
                    currentAdminProducts = resData.record || [];
                    localStorage.setItem('storeProducts', JSON.stringify(currentAdminProducts));
                } else {
                    throw new Error();
                }
            } catch (e) {
                currentAdminProducts = JSON.parse(localStorage.getItem('storeProducts')) || [];
            }

            renderAdminTable();
        }

        function renderAdminTable() {
            let tbody = document.getElementById('adminProductsList');
            tbody.innerHTML = '';
            
            if (!currentAdminProducts || currentAdminProducts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="color:#94a3b8;">لا توجد منتجات مضافة حالياً.</td></tr>';
                return;
            }

            currentAdminProducts.forEach((p, index) => {
                let imgSrc = p.image || p.img || 'https://via.placeholder.com/50';
                tbody.innerHTML += '<tr>' +
                    '<td><img src="' + imgSrc + '" width="40" height="40" style="border-radius:4px; object-fit: cover;" onerror="this.src=\'https://via.placeholder.com/50\'"></td>' +
                    '<td>' + p.name + '</td>' +
                    '<td>' + p.price + ' ج.م</td>' +
                    '<td><button onclick="deleteProduct(' + index + ')" style="background:#ef4444; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">حذف</button></td>' +
                '</tr>';
            });
        }

        async function addProduct() {
            let binId = getBinId();
            if(!binId) { alert('الرجاء إنشاء أو ربط Bin ID أولاً من الأعلى!'); return; }

            let name = document.getElementById('pName').value.trim();
            let price = parseFloat(document.getElementById('pPrice').value);
            let img = document.getElementById('pImg').value.trim();

            if (!name || isNaN(price)) { 
                alert('الرجاء إدخال اسم المنتج والسعر بشكل صحيح!'); 
                return; 
            }

            currentAdminProducts.push({
                name: name,
                price: price,
                image: img || 'https://via.placeholder.com/200',
                img: img || 'https://via.placeholder.com/200',
                category: "عام"
            });

            await updateCloudData(currentAdminProducts);

            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pImg').value = '';
            
            renderAdminTable();
            alert('✅ تمت إضافة المنتج وحفظه أونلاين بنجاح!');
        }

        async function deleteProduct(index) {
            let binId = getBinId();
            if(!binId) return;

            currentAdminProducts.splice(index, 1);
            await updateCloudData(currentAdminProducts);
            renderAdminTable();
        }

        async function updateCloudData(data) {
            let binId = getBinId();
            try {
                let response = await fetch('https://api.jsonbin.io/v3/b/' + binId, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(data)
                });
                if(response.ok) {
                    localStorage.setItem('storeProducts', JSON.stringify(data));
                } else {
                    alert('فشل التحديث في السحابة!');
                }
            } catch(err) {
                alert('خطأ في الاتصال بالسحابة!');
            }
        }

        window.onload = loadAdminProducts;
    </script>
</body>
</html>
