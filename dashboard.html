<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم والإدارة</title>
    <script>
        let pass = prompt("الرجاء إدخال كلمة سر لوحة التحكم:");
        if (pass !== "Ss@1234567890") {
            alert("كلمة المرور غير صحيحة!");
            window.location.href = "index.html";
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; direction: rtl; text-align: right; }
        .container { max-width: 1000px; margin: 0 auto; background: #1e293b; border: 2px dashed #6366f1; border-radius: 12px; padding: 20px; }
        h1 { color: #38bdf8; font-size: 20px; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        .btn { background: #10b981; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 20px; }
        .btn:hover { background: #059669; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px; }
        th, td { border: 1px solid #334155; padding: 8px; text-align: center; }
        th { background: #334155; color: #38bdf8; }
        .back-btn { background: #3b82f6; color: #fff; padding: 8px 15px; border-radius: 6px; text-decoration: none; display: inline-block; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>لوحة تحكم المتجر (إدارة المنتجات والطلبات)</h1>
        
        <div style="background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155;">
            <p style="color: #38bdf8; font-size: 14px; font-weight: bold;">✅ النظام يعمل الآن بوضع التخزين المحلي الفوري (مستقر وسريع بدون أخطاء سحابية).</p>
        </div>

        <div style="margin-bottom: 20px;">
            <h3>إضافة منتج جديد للمتجر</h3>
            <input type="text" id="pName" placeholder="اسم المنتج (مثال: كشري مصري، شاي ليبتون)">
            <input type="number" id="pPrice" placeholder="السعر (بالجنيه)">
            <input type="text" id="pImg" placeholder="رابط صورة المنتج (اختياري)">
            <button class="btn" onclick="addProduct()">إضافة المنتج وتحديث المتجر فوراً 🚀</button>
        </div>

        <h3>قائمة المنتجات الحالية في المتجر</h3>
        <table>
            <thead>
                <tr>
                    <th>الصورة</th>
                    <th>اسم المنتج</th>
                    <th>السعر</th>
                    <th>الإجراء</th>
                </tr>
            </thead>
            <tbody id="adminProductsList"></tbody>
        </table>
        <a href="index.html" class="back-btn">العودة إلى واجهة المتجر الرئيسية</a>
    </div>

    <script>
        let currentAdminProducts = [];

        function loadAdminProducts() {
            // جلب المنتجات المخزنة محلياً، أو وضع منتج افتراضي إذا كانت القائمة فارغة
            let saved = localStorage.getItem('storeProducts');
            if (saved) {
                try {
                    currentAdminProducts = JSON.parse(saved);
                } catch(e) {
                    currentAdminProducts = [];
                }
            } else {
                currentAdminProducts = [
                    { name: "شاي ليبتون أسود-100 جرام", price: 20, image: "https://via.placeholder.com/200", category: "عام" }
                ];
                localStorage.setItem('storeProducts', JSON.stringify(currentAdminProducts));
            }
            renderAdminTable();
        }

        function renderAdminTable() {
            let tbody = document.getElementById('adminProductsList');
            tbody.innerHTML = '';
            
            if (!currentAdminProducts || currentAdminProducts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="color:#94a3b8;">لا توجد منتجات مضافة حالياً.</td></tr>';
                return;
            }

            currentAdminProducts.forEach((p, index) => {
                let imgSrc = p.image || p.img || 'https://via.placeholder.com/50';
                tbody.innerHTML += '<tr>' +
                    '<td><img src="' + imgSrc + '" width="40" height="40" style="border-radius:4px; object-fit: cover;" onerror="this.src=\'https://via.placeholder.com/50\'"></td>' +
                    '<td>' + p.name + '</td>' +
                    '<td>' + p.price + ' ج.م</td>' +
                    '<td><button onclick="deleteProduct(' + index + ')" style="background:#ef4444; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">حذف</button></td>' +
                '</tr>';
            });
        }

        function addProduct() {
            let name = document.getElementById('pName').value.trim();
            let price = parseFloat(document.getElementById('pPrice').value);
            let img = document.getElementById('pImg').value.trim();

            if (!name || isNaN(price)) { 
                alert('الرجاء إدخال اسم المنتج والسعر بشكل صحيح!'); 
                return; 
            }

            currentAdminProducts.push({
                name: name,
                price: price,
                image: img || 'https://via.placeholder.com/200',
                img: img || 'https://via.placeholder.com/200',
                category: "عام"
            });

            // حفظ المنتجات محلياً لتظهر فوراً في واجهة العملاء
            localStorage.setItem('storeProducts', JSON.stringify(currentAdminProducts));

            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pImg').value = '';
            
            renderAdminTable();
            alert('✅ تمت إضافة وتحديث المنتج بنجاح وتزامن مع المتجر فوراً!');
        }

        function deleteProduct(index) {
            currentAdminProducts.splice(index, 1);
            localStorage.setItem('storeProducts', JSON.stringify(currentAdminProducts));
            renderAdminTable();
            alert('🗑️ تم حذف المنتج بنجاح!');
        }

        window.onload = loadAdminProducts;
    </script>
</body>
</html>
