<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة جاهز في بلطيم - تطبيق الكابتن</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; padding: 20px; direction: rtl; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1 { color: #f59e0b; text-align: center; }
        .order-card { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
        .no-orders { text-align: center; color: #94a3b8; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚴‍♂️ تطبيق الكابتن</h1>
        <p style="text-align: center; color: #94a3b8;">الطلبات المسندة للتوصيل</p>
        
        <div id="driverOrdersList">
            <div class="no-orders">جاري تحميل الطلبات...</div>
        </div>
    </div>

    <script>
        function loadDriverOrders() {
            const container = document.getElementById('driverOrdersList');
            
            // استرجاع الطلبات أو السلة من localStorage
            let orders = JSON.parse(localStorage.getItem('jahez_orders')) || [];
            let cart = JSON.parse(localStorage.getItem('jahez_cart')) || [];
            let customer = JSON.parse(localStorage.getItem('jahez_saved_customer')) || {};

            let html = '';

            // إذا لم توجد قائمة طلبات رسمية، ننشئ طلباً افتراضياً من السلة وبيانات العميل لتظهر للكابتن
            if (orders.length === 0 && cart.length > 0) {
                orders = [{
                    id: 101,
                    customerName: customer.name || 'عميل كريم',
                    phone: customer.phone || 'غير محدد',
                    address: customer.address || 'بلطيم',
                    items: cart,
                    driver: localStorage.getItem('jahez_order_101_driver') || 'قيد الانتظار'
                }];
            }

            if (orders.length === 0) {
                container.innerHTML = '<div class="no-orders">لا توجد طلبات مسندة حالياً.</div>';
                return;
            }

            orders.forEach(order => {
let driverName = order.driver || localStorage.getItem(`jahez_order_${order.id || 101}_driver`) || 'مهند سامح الشبة';
// إذا كانت القيمة أرقام فقط، نعرض الاسم النصي المناسب
if (!isNaN(driverName) || driverName.length > 10) {
    driverName = 'مهند سامح الشبة';
}
              <div class="order-card">
                        <h3 style="color: #f59e0b; margin-top: 0;">طلب #${order.id || 101}</h3>
                        <p><strong>العميل:</strong> ${order.customerName || customer.name || 'غير معروف'}</p>
                        <p><strong>الهاتف:</strong> ${order.phone || customer.phone || 'غير معروف'}</p>
                        <p><strong>العنوان:</strong> ${order.address || customer.address || 'غير محدد'}</p>
                        <p><strong>الكابتن المسند:</strong> <span style="color: #22c55e; font-weight: bold;">${driverName}</span></p>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        window.onload = loadDriverOrders;
    </script>
</body>
</html>
