<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الكابتن - جاهز</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; padding: 20px; direction: rtl; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1, h2 { color: #f59e0b; text-align: center; }
        .section { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
        select { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #334155; background: #1e293b; color: #fff; box-sizing: border-box; }
        button { cursor: pointer; font-weight: bold; border: none; border-radius: 5px; padding: 10px 15px; background: #22c55e; color: #fff; width: 100%; }
        .map-btn { background: #3b82f6; display: block; text-align: center; padding: 10px; text-decoration: none; border-radius: 5px; color: #fff; font-weight: bold; margin-top: 10px; }
        .order-card { background: #1e293b; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #475569; animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { border-color: #475569; }
            50% { border-color: #f59e0b; }
            100% { border-color: #475569; }
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBur8SO0RjrJvutWYRy7QdRepUJWtQzQLY",
            authDomain: "readystore-542e0.firebaseapp.com",
            projectId: "readystore-542e0",
            storageBucket: "readystore-542e0.firebasestorage.app",
            messagingSenderId: "698121296035",
            appId: "1:698121296035:web:6d237104d976e11120c716",
            measurementId: "G-56NZSGK3P2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentDriverName = localStorage.getItem('jahez_logged_driver') || '';
        let previousOrdersCount = -1;

        // دالة تشغيل صوت التنبيه (تنبيه موسيقي / نغمة تنبيه واضحة)
        function playAlertSound() {
            try {
                // استخدام صوت تنبيه مدمج عبر مكتبة الصوت في المتصفح أو رنين موجي
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime); // نغمة D5
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15); // نغمة A5
                
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.6);
            } catch (e) {
                console.log("Audio not supported or blocked", e);
            }
        }

        function loadDriversDropdown() {
            const driversRef = ref(db, 'driversList');
            onValue(driversRef, (snapshot) => {
                const data = snapshot.val();
                const select = document.getElementById('driverSelect');
                select.innerHTML = '<option value="">-- اختر اسمك من القائمة --</option>';
                if (data) {
                    Object.keys(data).forEach((key) => {
                        let d = data[key];
                        select.innerHTML += `<option value="${d.name}">${d.name}</option>`;
                    });
                }
                if (currentDriverName) { select.value = currentDriverName; }
            });
        }

        window.loginDriver = function() {
            const select = document.getElementById('driverSelect');
            const name = select.value.trim();
            if (!name) { alert('الرجاء اختيار اسمك من القائمة!'); return; }
            currentDriverName = name;
            localStorage.setItem('jahez_logged_driver', name);
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('driverDashboard').style.display = 'block';
            document.getElementById('welcomeDriverTitle').innerText = 'أهلاً بك يا كابتن: ' + name;
            
            // تفعيل صوت مبدئي لتنشيط المتصفح
            playAlertSound();
            listenToAssignedOrders();
        }

        function listenToAssignedOrders() {
            const container = document.getElementById('driverOrdersList');
            const ordersRef = ref(db, 'adminOrders');

            onValue(ordersRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    container.innerHTML = '<p style="color: #94a3b8; text-align: center;">لا توجد طلبات مسندة إليك حالياً.</p>';
                    previousOrdersCount = 0;
                    return;
                }

                let html = '';
                let found = false;
                let currentAssignedCount = 0;

                Object.keys(data).forEach((orderKey) => {
                    let order = data[orderKey];
                    if (order.driver && order.driver.trim() === currentDriverName.trim()) {
                        found = true;
                        currentAssignedCount++;
                        let itemsText = order.items ? order.items.map(i => `${i.name} (x${i.quantity})`).join(', ') : '';
                        let mapLink = `https://www.google.com/maps/dir/?api=1&destination=${order.lat},${order.lng}`;

                        html += `
                            <div class="order-card">
                                <h3 style="color: #f59e0b; margin-top: 0;">طلب جديد #${order.id} 🚨</h3>
                                <p><strong>اسم العميل:</strong> ${order.customerName}</p>
                                <p><strong>العنوان بالتفصيل:</strong> ${order.customerAddress}</p>
                                <a href="${mapLink}" target="_blank" class="map-btn">🧭 افتح خريطة التوجيه للعميل (Google Maps)</a>
                                <p style="margin-top: 10px;"><strong>طريقة الدفع:</strong> <span style="color: #38bdf8; font-weight: bold;">${order.paymentMethod}</span></p>
                                <p><strong>الأصناف:</strong> ${itemsText}</p>
                                <p style="color: #22c55e; font-weight: bold;">المطلوب تحصيله: ${order.total} جنيه</p>
                                <p><strong>الحالة:</strong> ${order.status}</p>
                                <button type="button" style="background: #3b82f6; margin-top: 10px;" onclick="finishOrder('${orderKey}')">تم التوصيل بنجاح ✅</button>
                            </div>
                        `;
                    }
                });

                // إذا زاد عدد الطلبات المسندة، قم بتشغيل التنبيه الصوتي فوراً!
                if (previousOrdersCount !== -1 && currentAssignedCount > previousOrdersCount) {
                    playAlertSound();
                }
                previousOrdersCount = currentAssignedCount;

                if (!found) {
                    container.innerHTML = '<p style="color: #94a3b8; text-align: center;">لا توجد طلبات مسندة إليك حالياً.</p>';
                } else {
                    container.innerHTML = html;
                }
            });
        }

        window.finishOrder = function(orderKey) {
            update(ref(db, 'adminOrders/' + orderKey), {
                status: 'تم توصيل الطلب بنجاح بواسطة ' + currentDriverName
            });
            alert('تم تحديث حالة الطلب إلى (تم التوصيل)!');
        }

        window.onload = function() {
            loadDriversDropdown();
            if (currentDriverName) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('driverDashboard').style.display = 'block';
                document.getElementById('welcomeDriverTitle').innerText = 'أهلاً بك يا كابتن: ' + currentDriverName;
                listenToAssignedOrders();
            }
        };
    </script>
</head>
<body>
    <div class="container">
        <h1>🚴 تطبيق الكابتن - جاهز</h1>

        <div id="loginSection" class="section">
            <h2>تسجيل دخول الكابتن</h2>
            <select id="driverSelect"></select>
            <button type="button" onclick="loginDriver()">دخول إلى التطبيق 🚀</button>
        </div>

        <div id="driverDashboard" class="section" style="display: none;">
            <h2 id="welcomeDriverTitle" style="font-size: 18px; color: #fbbf24;"></h2>
            <h3 style="color: #fff; border-bottom: 1px solid #334155; padding-bottom: 8px;">📦 الطلبات المسندة إليك (تحديث حي 🔴)</h3>
            <div id="driverOrdersList">جاري جلب الطلبات...</div>
            <br>
            <button type="button" style="background: #ef4444; font-size: 12px; padding: 6px;" onclick="localStorage.removeItem('jahez_logged_driver'); location.reload();">تسجيل الخروج</button>
        </div>
    </div>
</body>
</html>
