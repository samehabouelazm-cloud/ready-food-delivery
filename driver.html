<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة جاهز في بلطيم - تطبيق الكابتن</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; padding: 20px; direction: rtl; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1 { color: #f59e0b; text-align: center; }
        .order-card { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
        .deliver-btn { background: #22c55e; color: #fff; width: 100%; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .map-link { display: inline-block; background: #0ea5e9; color: #fff; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚴‍♂️ تطبيق الكابتن</h1>
        <p style="text-align: center; color: #94a3b8;">الطلبات المسندة إليك وطرق الدفع</p>
        
        <div id="driverOrdersList">
            <div style="text-align: center; color: #94a3b8;">جاري تحميل الطلبات...</div>
        </div>
    </div>

    <script>
        function loadDriverOrders() {
            const container = document.getElementById('driverOrdersList');
            let orders = JSON.parse(localStorage.getItem('jahez_orders')) || [];

            let activeOrders = orders.filter(o => o.driver && o.driver !== 'قيد الانتظار' && o.status !== 'تم التسليم للعميل');

            if (activeOrders.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #94a3b8;">لا توجد طلبات جديدة مسندة إليك حالياً.</div>';
                return;
            }

            let html = '';
            activeOrders.forEach(order => {
                let itemsText = order.items.map(i => `${i.name} (×${i.quantity})`).join(', ');
                html += `
                    <div class="order-card">
                        <h3 style="color: #f59e0b; margin-top: 0;">طلب #${order.id}</h3>
                        <p><strong>اسم العميل:</strong> ${order.customerName}</p>
                        <p><strong>رقم الهاتف:</strong> ${order.phone}</p>
                        <p><strong>طريقة الدفع:</strong> <span style="color: #38bdf8; font-weight: bold;">${order.paymentMethod || 'كاش'}</span></p>
                        <p><strong>موقع العميل:</strong> ${order.address} <br>
                           <a class="map-link" href="https://maps.google.com/?q=${order.lat},${order.lng}" target="_blank">🗺️ فتح الخريطة لتتبع موقع العميل</a>
                        </p>
                        <p><strong>الأصناف:</strong> ${itemsText}</p>
                        <p><strong>الكابتن المسؤول:</strong> <span style="color: #22c55e; font-weight: bold;">${order.driver}</span></p>
                        <button type="button" class="deliver-btn" onclick="completeDelivery('${order.id}')">تأكيد تسليم الطلب للعميل ✅</button>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function completeDelivery(orderId) {
            let orders = JSON.parse(localStorage.getItem('jahez_orders')) || [];
            let order = orders.find(o => o.id == orderId);
            if (order) {
                order.status = 'تم التسليم للعميل';
                localStorage.setItem('jahez_orders', JSON.stringify(orders));
                alert(`تم تأكيد تسليم الطلب #${orderId}!`);
                loadDriverOrders();
            }
        }

        window.onload = loadDriverOrders;
    </script>
</body>
</html>
