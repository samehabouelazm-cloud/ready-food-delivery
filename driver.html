<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الكابتن - جاهز</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; padding: 20px; direction: rtl; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1, h2 { color: #f59e0b; text-align: center; }
        .section { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
        select { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #334155; background: #1e293b; color: #fff; box-sizing: border-box; }
        button { cursor: pointer; font-weight: bold; border: none; border-radius: 5px; padding: 12px 15px; background: #22c55e; color: #fff; width: 100%; font-size: 15px; }
        .map-btn { background: #3b82f6; display: block; text-align: center; padding: 10px; text-decoration: none; border-radius: 5px; color: #fff; font-weight: bold; margin-top: 10px; }
        .order-card { background: #1e293b; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 2px solid #f59e0b; animation: alertPulse 1s infinite alternate; }
        @keyframes alertPulse {
            0% { transform: scale(1); box-shadow: 0 0 5px rgba(245, 158, 11, 0.5); }
            100% { transform: scale(1.01); box-shadow: 0 0 20px rgba(245, 158, 11, 0.9); }
        }
        .sound-badge { background: #334155; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 15px; font-size: 13px; border: 1px solid #475569; display: none; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBur8SO0RjrJvutWYRy7QdRepUJWtQzQLY",
            authDomain: "readystore-542e0.firebaseapp.com",
            projectId: "readystore-542e0",
            storageBucket: "readystore-542e0.firebasestorage.app",
            messagingSenderId: "698121296035",
            appId: "1:698121296035:web:6d237104d976e11120c716",
            measurementId: "G-56NZSGK3P2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentDriverName = localStorage.getItem('jahez_logged_driver') || '';
        let previousAssignedCount = -1;
        let audioContext = null;

        function checkAutoSound() {
            if (localStorage.getItem('jahez_sound_enabled') === 'true') {
                initAudioContext();
            } else {
                document.getElementById('soundStatusDiv').style.display = 'block';
            }
        }

        function initAudioContext() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                localStorage.setItem('jahez_sound_enabled', 'true');
                document.getElementById('soundStatusDiv').style.display = 'none';
            } catch (e) {
                console.log("Audio error", e);
            }
        }

        window.enableSoundAlerts = function() {
            initAudioContext();
            playDriverAlarm();
            alert("✅ تم حفظ وتفعيل التنبيهات الصوتية للكابتن بنجاح!");
        }

        // نغمة إنذار قوية ومميزة للكابتن عند إسناد طلب له
        function playDriverAlarm() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }

                const now = audioContext.currentTime;
                // نغمة صفارة إنذار مزدوجة واضحة ومسموعة بوضوح
                [0, 0.25, 0.5].forEach((delay, index) => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(700 + (index * 300), now + delay);
                    
                    gain.gain.setValueAtTime(0.4, now + delay);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.2);

                    osc.connect(gain);
                    gain.connect(audioContext.destination);

                    osc.start(now + delay);
                    osc.stop(now + delay + 0.2);
                });
            } catch (e) {
                console.log("Driver alarm error", e);
            }
        }

        function loadDriversDropdown() {
            const driversRef = ref(db, 'driversList');
            onValue(driversRef, (snapshot) => {
                const data = snapshot.val();
                const select = document.getElementById('driverSelect');
                select.innerHTML = '<option value="">-- اختر اسمك من القائمة --</option>';
                if (data) {
                    Object.keys(data).forEach((key) => {
                        let d = data[key];
                        select.innerHTML += `<option value="${d.name}">${d.name}</option>`;
                    });
                }
                if (currentDriverName) { select.value = currentDriverName; }
            });
        }

        window.loginDriver = function() {
            const select = document.getElementById('driverSelect');
            const name = select.value.trim();
            if (!name) { alert('الرجاء اختيار اسمك من القائمة!'); return; }
            
            currentDriverName = name;
            localStorage.setItem('jahez_logged_driver', name);
            initAudioContext();

            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('driverDashboard').style.display = 'block';
            document.getElementById('welcomeDriverTitle').innerText = 'أهلاً بك يا كابتن: ' + name;
            
            listenToAssignedOrders();
        }

        function listenToAssignedOrders() {
            const container = document.getElementById('driverOrdersList');
            const ordersRef = ref(db, 'adminOrders');

            onValue(ordersRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    container.innerHTML = '<p style="color: #94a3b8; text-align: center;">لا توجد طلبات مسندة إليك حالياً.</p>';
                    previousAssignedCount = 0;
                    return;
                }

                let html = '';
                let found = false;
                let currentAssignedCount = 0;

                Object.keys(data).forEach((orderKey) => {
                    let order = data[orderKey];
                    if (order.driver && order.driver.trim() === currentDriverName.trim()) {
                        found = true;
                        currentAssignedCount++;
                        let itemsText = order.items ? order.items.map(i => `${i.name} (x${i.quantity})`).join(', ') : '';
                        let mapLink = `https://www.google.com/maps/dir/?api=1&destination=${order.lat},${order.lng}`;

                        html += `
                            <div class="order-card">
                                <h3 style="color: #f59e0b; margin-top: 0;">🚨 طلب جديد مسند إليك! #${order.id}</h3>
                                <p><strong>اسم العميل:</strong> ${order.customerName}</p>
                                <p><strong>العنوان بالتفصيل:</strong> ${order.customerAddress}</p>
                                <a href="${mapLink}" target="_blank" class="map-btn">🧭 افتح خريطة التوجيه للعميل (Google Maps)</a>
                                <p style="margin-top: 10px;"><strong>طريقة الدفع:</strong> <span style="color: #38bdf8; font-weight: bold;">${order.paymentMethod}</span></p>
                                <p><strong>الأصناف:</strong> ${itemsText}</p>
                                <p style="color: #22c55e; font-weight: bold;">المطلوب تحصيله: ${order.total} جنيه</p>
                                <p><strong>الحالة:</strong> ${order.status}</p>
                                <button type="button" style="background: #3b82f6; margin-top: 10px;" onclick="finishOrder('${orderKey}')">تم التوصيل بنجاح ✅</button>
                            </div>
                        `;
                    }
                });

                // إذا زاد عدد الطلبات المسندة لهذا الكابتن، يصدر إنذار صوتي قوي فوراً!
                if (previousAssignedCount !== -1 && currentAssignedCount > previousAssignedCount) {
                    playDriverAlarm();
                }
                previousAssignedCount = currentAssignedCount;

                if (!found) {
                    container.innerHTML = '<p style="color: #94a3b8; text-align: center;">لا توجد طلبات مسندة إليك حالياً.</p>';
                } else {
                    container.innerHTML = html;
                }
            });
        }

        window.finishOrder = function(orderKey) {
            update(ref(db, 'adminOrders/' + orderKey), {
                status: 'تم توصيل الطلب بنجاح بواسطة ' + currentDriverName
            });
            alert('تم تحديث حالة الطلب إلى (تم التوصيل)!');
        }

        window.onload = function() {
            loadDriversDropdown();
            checkAutoSound();
            if (currentDriverName) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('driverDashboard').style.display = 'block';
                document.getElementById('welcomeDriverTitle').innerText = 'أهلاً بك يا كابتن: ' + currentDriverName;
                listenToAssignedOrders();
            }
        };
    </script>
</head>
<body>
    <div class="container">
        <h1>🚴 تطبيق الكابتن - جاهز</h1>

        <div id="loginSection" class="section">
            <h2>تسجيل دخول الكابتن</h2>
            <select id="driverSelect"></select>
            <button type="button" onclick="loginDriver()">دخول إلى التطبيق 🚀</button>
        </div>

        <div id="driverDashboard" class="section" style="display: none;">
            <h2 id="welcomeDriverTitle" style="font-size: 18px; color: #fbbf24;"></h2>
            
            <div id="soundStatusDiv" class="sound-badge">
                <span style="color: #fbbf24;">⚠️ تفعيل التنبيهات الصوتية (للمرة الأولى فقط)</span><br><br>
                <button type="button" style="background: #3b82f6; padding: 8px;" onclick="enableSoundAlerts()">🔊 اضغط هنا لتفعيل وحفظ صوت التنبيه دائماً</button>
            </div>

            <h3 style="color: #fff; border-bottom: 1px solid #334155; padding-bottom: 8px;">📦 الطلبات المسندة إليك (تحديث حي 🔴)</h3>
            <div id="driverOrdersList">جاري جلب الطلبات...</div>
            <br>
            <button type="button" style="background: #ef4444; font-size: 12px; padding: 6px;" onclick="localStorage.removeItem('jahez_logged_driver'); location.reload();">تسجيل الخروج</button>
        </div>
    </div>
</body>
</html>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الكابتن - منصة جاهز</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; padding: 20px; direction: rtl; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        h1 { color: #f59e0b; text-align: center; }
        .order-card { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
        button { cursor: pointer; font-weight: bold; border: none; border-radius: 6px; padding: 10px 15px; background: #22c55e; color: #fff; width: 100%; margin-top: 8px; }
        .btn-delivering { background: #3b82f6; }
        .btn-done { background: #10b981; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚴 لوحة الكابتن السحابي</h1>
        
        <div style="margin-bottom: 15px;">
            <label>اختر اسمك (الكابتن):</label>
            <input type="text" id="driverNameLogin" placeholder="أدخل اسمك المسجل بالإدارة" style="width:100%; padding:10px; margin-top:5px; background:#0f172a; color:#fff; border:1px solid #334155; border-radius:6px; box-sizing:border-box;">
            <button onclick="saveDriverLogin()">💾 حفظ اسمي ومتابعة الطلبات</button>
        </div>

        <hr style="border-color: #334155; margin: 20px 0;">
        
        <h3>📦 الطلبات المسندة إليك:</h3>
        <div id="driverOrdersContainer">جاري تحميل طلباتك...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBur8SO0RjrJvutWYRy7QdRepUJWtQzQLY",
            authDomain: "readystore-542e0.firebaseapp.com",
            projectId: "readystore-542e0",
            storageBucket: "readystore-542e0.firebasestorage.app",
            messagingSenderId: "698121296035",
            appId: "1:698121296035:web:6d237104d976e11120c716",
            measurementId: "G-56NZSGK3P2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.saveDriverLogin = function() {
            const name = document.getElementById('driverNameLogin').value.trim();
            if(!name) { alert('الرجاء كتابة اسمك أولاً'); return; }
            localStorage.setItem('jahez_active_driver', name);
            alert('✅ تم حفظ اسمك بنجاح، سيتم عرض طلباتك الآن.');
            location.reload();
        };

        window.onload = function() {
            const savedName = localStorage.getItem('jahez_active_driver');
            if(savedName) {
                document.getElementById('driverNameLogin').value = savedName;
                listenToDriverOrders(savedName);
            }
        };

        function listenToDriverOrders(driverName) {
            const ordersRef = ref(db, 'adminOrders');
            onValue(ordersRef, (snapshot) => {
                const data = snapshot.val();
                const container = document.getElementById('driverOrdersContainer');
                if(!data) {
                    container.innerHTML = '<p style="color:#94a3b8;">لا توجد طلبات حالياً.</p>';
                    return;
                }

                let html = '';
                Object.keys(data).forEach(key => {
                    let order = data[key];
                    // عرض الطلبات المخصصة لهذا الكابتن فقط
                    if(order.driver === driverName && order.status !== 'مكتمل') {
                        let itemsText = order.items ? order.items.map(i => `${i.name} (x${i.quantity})`).join(', ') : '';
                        html += `
                            <div class="order-card">
                                <h4>طلب رقم #${key}</h4>
                                <p><strong>العميل:</strong> ${order.customerName}</p>
                                <p><strong>الهاتف:</strong> <a href="tel:${order.customerPhone}" style="color:#60a5fa;">${order.customerPhone}</a></p>
                                <p><strong>العنوان:</strong> ${order.customerAddress}</p>
                                <p><strong>الأصناف:</strong> ${itemsText}</p>
                                <p><strong>الإجمالي المطلوب:</strong> ${(parseFloat(order.total || 0) + parseFloat(order.deliveryFee || 0))} جنيه</p>
                                <p><strong>الحالة الحالية:</strong> <span style="color:#f59e0b;">${order.status || 'جديد'}</span></p>
                                
                                <button class="btn-delivering" onclick="updateOrderStatus('${key}', 'جاري التوصيل')">🚀 بدء التوصيل في الطريق</button>
                                <button class="btn-done" onclick="updateOrderStatus('${key}', 'مكتمل')">✅ تم تسليم الطلب للعميل بنجاح</button>
                            </div>
                        `;
                    }
                });
                container.innerHTML = html || '<p style="color:#94a3b8;">لا توجد طلبات جديدة مسندة إليك حالياً.</p>';
            });
        }

        window.updateOrderStatus = function(orderId, newStatus) {
            update(ref(db, 'adminOrders/' + orderId), {
                status: newStatus
            }).then(() => {
                alert('✅ تم تحديث حالة الطلب أوتوماتيكياً بنجاح!');
            });
        };
    </script>
</body>
</html>
