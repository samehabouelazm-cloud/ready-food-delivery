<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاهز في بلطيم - تطبيق العميل</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0b132b; color: #fff; margin: 0; padding: 20px; direction: rtl; text-align: right; }
        .container { max-width: 600px; margin: 0 auto; background: #1c2541; padding: 20px; border-radius: 10px; }
        .item-card { background: #3a506b; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        button { cursor: pointer; padding: 8px 15px; border: none; border-radius: 5px; background: #4cc9f0; color: #000; font-weight: bold; }
        button:hover { background: #4361ee; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ منصة جاهز في بلطيم</h1>
        <p>اختر أصنافك المفضلة وحدد الكميات بكل سهولة:</p>
        
        <div class="item-card">
            <h3>وجبة كبدة مميزة</h3>
            <p>السعر: 50 جنيه</p>
            
            <div style="display: flex; align-items: center; gap: 10px; margin: 10px 0;">
                <button type="button" onclick="decreaseQty('item_kibda')">-</button>
                <span id="qty_item_kibda" style="font-weight: bold; font-size: 18px;">1</span>
                <button type="button" onclick="increaseQty('item_kibda')">+</button>
            </div>
            
            <button type="button" onclick="addToCartWithQty('item_kibda', 'وجبة كبدة مميزة', 50)" style="background: #28a745; color: #fff;">إضافة للسلة</button>
        </div>

        <div style="margin-top: 30px; background: #222d4a; padding: 15px; border-radius: 8px;">
            <h3>بيانات التوصيل</h3>
            <input type="text" id="customerName" placeholder="الاسم الكريم" style="width:100%; padding:8px; margin-bottom:10px; border-radius:5px; border:none;" oninput="saveCustomerDetails()">
            <input type="text" id="customerPhone" placeholder="رقم الهاتف" style="width:100%; padding:8px; margin-bottom:10px; border-radius:5px; border:none;" oninput="saveCustomerDetails()">
            <input type="text" id="customerAddress" placeholder="العنوان بالتفصيل" style="width:100%; padding:8px; margin-bottom:10px; border-radius:5px; border:none;" oninput="saveCustomerDetails()">
        </div>
    </div>

    <script>
        function saveCustomerDetails() {
            const customerData = {
                name: document.getElementById('customerName')?.value || '',
                phone: document.getElementById('customerPhone')?.value || '',
                address: document.getElementById('customerAddress')?.value || '',
                lat: window.currentLatitude || null,
                lng: window.currentLongitude || null
            };
            localStorage.setItem('jahez_saved_customer', JSON.stringify(customerData));
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('jahez_saved_customer');
            if (saved) {
                const data = JSON.parse(saved);
                if (document.getElementById('customerName')) document.getElementById('customerName').value = data.name || '';
                if (document.getElementById('customerPhone')) document.getElementById('customerPhone').value = data.phone || '';
                if (document.getElementById('customerAddress')) document.getElementById('customerAddress').value = data.address || '';
            }
        });

        const itemQuantities = {};

        function increaseQty(itemId) {
            if (!itemQuantities[itemId]) itemQuantities[itemId] = 1;
            itemQuantities[itemId]++;
            const el = document.getElementById(`qty_${itemId}`);
            if (el) el.innerText = itemQuantities[itemId];
        }

        function decreaseQty(itemId) {
            if (itemQuantities[itemId] && itemQuantities[itemId] > 1) {
                itemQuantities[itemId]--;
                const el = document.getElementById(`qty_${itemId}`);
                if (el) el.innerText = itemQuantities[itemId];
            }
        }

        function addToCartWithQty(itemId, itemName, itemPrice) {
            const qty = itemQuantities[itemId] || 1;
            let cart = JSON.parse(localStorage.getItem('jahez_cart')) || [];
            
            const existingItem = cart.find(i => i.id === itemId);
            if (existingItem) {
                existingItem.quantity += qty;
            } else {
                cart.push({ id: itemId, name: itemName, price: itemPrice, quantity: qty });
            }
            
            localStorage.setItem('jahez_cart', JSON.stringify(cart));
            alert(`تمت إضافة ${qty} من (${itemName}) إلى السلة بنجاح!`);
            
            itemQuantities[itemId] = 1;
            const qtyElement = document.getElementById(`qty_${itemId}`);
            if (qtyElement) qtyElement.innerText = '1';
        }
    </script>
</body>
</html>
