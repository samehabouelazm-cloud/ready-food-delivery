<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>READY OS - طلب الطعام</title>
    <!-- تضمين مكتبة Leaflet للخريطة التفاعلية -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 15px; padding-bottom: 80px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #334155; margin-bottom: 20px; }
        .brand { font-size: 22px; font-weight: bold; color: #f59e0b; }
        .status-badge { font-size: 13px; padding: 4px 10px; border-radius: 20px; font-weight: bold; }
        .open { background: #10b98122; color: #10b981; border: 1px solid #10b981; }
        .closed { background: #ef444422; color: #ef4444; border: 1px solid #ef4444; }
        
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }
        .card img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
        .card-title { font-weight: bold; font-size: 15px; color: #f1f5f9; }
        .card-price { color: #10b981; font-weight: bold; margin-top: 4px; }
        .btn-add { background: #f59e0b; color: #0f172a; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; width: 100%; }

        .checkout-section { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 15px; margin-bottom: 25px; }
        .checkout-section h3 { color: #f59e0b; margin-bottom: 12px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
        #map { height: 160px; border-radius: 8px; border: 1px solid #334155; margin-top: 8px; }

        .cart-summary { background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 12px; border: 1px dashed #334155; }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; }
        .btn-submit { background: #10b981; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; }

        .active-order { background: #1e293b; border: 1px solid #f59e0b; border-radius: 12px; padding: 15px; margin-top: 20px; }
        .order-step { display: flex; align-items: center; margin-top: 10px; gap: 10px; font-size: 14px; color: #94a3b8; }
        .step-active { color: #10b981; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">🍔 READY OS</div>
        <div id="storeStatus" class="status-badge open">جاري التحقق...</div>
    </div>

    <!-- قائمة الطعام -->
    <h3 style="margin-bottom: 12px; color: #cbd5e1;">📋 المنيو</h3>
    <div id="menuContainer" class="menu-grid">
        <p style="color:#94a3b8;">جاري تحميل القائمة...</p>
    </div>

    <!-- إتمام الطلب -->
    <div class="checkout-section">
        <h3>🛒 إتمام الطلب</h3>
        <div class="cart-summary" id="cartSummary">
            <p style="color:#94a3b8; font-size:13px;">السلة فارغة، اختر من المنيو أعلاه.</p>
        </div>

        <div class="form-group">
            <label>اسمك الكريم</label>
            <input type="text" id="custName" placeholder="أدخل اسمك الكامل">
        </div>
        <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="tel" id="custPhone" placeholder="01xxxxxxxxx">
        </div>
        <div class="form-group">
            <label>ملاحظات إضافية (مثل: بدون بصل، صوص خارجي)</label>
            <textarea id="custNotes" rows="2" placeholder="اكتب أي ملاحظة تخص الوجبة أو التوصيل..."></textarea>
        </div>
        <div class="form-group">
            <label>تحديد موقع التوصيل على الخريطة</label>
            <div id="map"></div>
        </div>

        <button class="btn-submit" onclick="submitOrder()">تأكيد وإرسال الطلب 🚀</button>
    </div>

    <!-- تتبع الطلب الحالي -->
    <div id="activeOrderSection" class="active-order" style="display:none;">
        <h3 style="color:#f59e0b; margin-bottom:8px;">📡 تتبع طلبك الحالي</h3>
        <div id="orderStatusText" style="font-weight:bold; color:#10b981; margin-bottom:10px;">جاري معالجة الطلب...</div>
        <div class="order-step" id="stepPending">1. 🟡 جاري التجهيز والتحضير</div>
        <div class="order-step" id="stepDelivering">2. 🛵 الطلب في الطريق مع الكابتن</div>
        <div class="order-step" id="stepCompleted">3. 🟢 تم التوصيل بنجاح</div>
        <div id="driverInfo" style="margin-top:10px; font-size:13px; color:#cbd5e1;"></div>
    </div>

    <script>
        let cart = [];
        let map, marker;
        let selectedLocation = { lat: 30.0444, lng: 31.2357 };
        let activeOrderId = null;

        // تهيئة الخريطة
        function initMap() {
            map = L.map('map').setView([selectedLocation.lat, selectedLocation.lng], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            marker = L.marker([selectedLocation.lat, selectedLocation.lng], { draggable: true }).addTo(map);
            marker.on('dragend', function (e) {
                const position = marker.getLatLng();
                selectedLocation = { lat: position.lat, lng: position.lng };
            });
        }

        async function fetchMenuAndStatus() {
            try {
                // جلب المنيو
                const resMenu = await fetch('/api/menu');
                const menu = await resMenu.json();
                const container = document.getElementById('menuContainer');
                
                container.innerHTML = menu.map(item => `
                    <div class="card">
                        <div>
                            <img src="${item.imageUrl || 'https://via.placeholder.com/150'}" alt="${item.name}">
                            <div class="card-title">${item.name}</div>
                            <div class="card-price">${item.price} ج.م</div>
                        </div>
                        <button class="btn-add" onclick='addToCart(${JSON.stringify(item)})'>+ إضافة</button>
                    </div>
                `).join('');

                // جلب حالة المطعم
                const resStats = await fetch('/api/stats');
                const stats = await resStats.json();
                const statusBadge = document.getElementById('storeStatus');
                if (stats.isStoreOpen) {
                    statusBadge.className = 'status-badge open';
                    statusBadge.innerText = 'المطعم مفتوح 🟢';
                } else {
                    statusBadge.className = 'status-badge closed';
                    statusBadge.innerText = 'المطعم مغلق حالياً 🔴';
                }
            } catch (err) { console.error(err); }
        }

        function addToCart(item) {
            cart.push(item);
            renderCart();
        }

        function renderCart() {
            const summary = document.getElementById('cartSummary');
            if (cart.length === 0) {
                summary.innerHTML = '<p style="color:#94a3b8; font-size:13px;">السلة فارغة، اختر من المنيو أعلاه.</p>';
                return;
            }
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            summary.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <span>${item.name}</span>
                    <span>${item.price} ج.م</span>
                </div>
            `).join('') + `<hr style="border-color:#334155; margin:8px 0;">
            <div class="cart-item" style="font-weight:bold; color:#10b981;">
                <span>الإجمالي</span>
                <span>${total} ج.م</span>
            </div>`;
        }

        async function submitOrder() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const notes = document.getElementById('custNotes').value.trim();

            if (!name || !phone) {
                alert('يرجى إدخال اسمك ورقم الهاتف.');
                return;
            }
            if (cart.length === 0) {
                alert('يرجى إضافة وجبة واحدة على الأقل للسلة.');
                return;
            }

            const totalAmount = cart.reduce((sum, item) => sum + item.price, 0);

            try {
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customerName: name,
                        customerPhone: phone,
                        notes: notes,
                        items: cart,
                        totalAmount: totalAmount,
                        location: selectedLocation
                    })
                });

                const data = await res.json();
                if (data.success) {
                    alert('تم إرسال طلبك بنجاح! جاري التجهيز.');
                    activeOrderId = data.order._id;
                    cart = [];
                    renderCart();
                    document.getElementById('activeOrderSection').style.display = 'block';
                    trackActiveOrder();
                } else {
                    alert(data.message || 'تعذر إرسال الطلب');
                }
            } catch (err) { alert('حدث خطأ في الاتصال بالسيرفر'); }
        }

        async function trackActiveOrder() {
            if (!activeOrderId) return;
            try {
                const res = await fetch('/api/orders');
                const orders = await res.json();
                const myOrder = orders.find(o => o._id === activeOrderId);

                if (!myOrder) return;

                const stepPending = document.getElementById('stepPending');
                const stepDelivering = document.getElementById('stepDelivering');
                const stepCompleted = document.getElementById('stepCompleted');
                const driverInfo = document.getElementById('driverInfo');

                stepPending.className = 'order-step';
                stepDelivering.className = 'order-step';
                stepCompleted.className = 'order-step';

                if (myOrder.status === 'pending') {
                    stepPending.className = 'order-step step-active';
                    document.getElementById('orderStatusText').innerText = '⏳ الطلب قيد التحضير في المطبخ...';
                } else if (myOrder.status === 'delivering') {
                    stepDelivering.className = 'order-step step-active';
                    document.getElementById('orderStatusText').innerText = '🛵 الطلب مع الكابتن وفي الطريق إليك!';
                    if (myOrder.driverName) {
                        driverInfo.innerText = `الكابتن: ${myOrder.driverName} (${myOrder.driverPhone || 'بدون رقم'})`;
                    }
                } else if (myOrder.status === 'completed') {
                    stepCompleted.className = 'order-step step-active';
                    document.getElementById('orderStatusText').innerText = '✅ تم توصيل الطلب بنجاح! وبالهناء والشفاء.';
                }
            } catch (err) { console.error(err); }
        }

        window.onload = () => {
            initMap();
            fetchMenuAndStatus();
            setInterval(fetchMenuAndStatus, 15000);
            setInterval(trackActiveOrder, 5000);
        };
    </script>
</body>
</html>
