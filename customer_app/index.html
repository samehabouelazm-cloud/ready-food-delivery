<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاهز في بلطيم - طلب الطعام أونلاين</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
    header h1 { color: #38bdf8; font-size: 22px; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .menu-card { background: #1e293b; padding: 15px; border-radius: 10px; border: 1px solid #334155; text-align: center; }
    .price { color: #10b981; font-weight: bold; margin: 10px 0; font-size: 18px; }
    .btn { padding: 8px 15px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #2563eb; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🍕 جاهز في بلطيم</h1>
    <span style="color:#94a3b8;">أسرع توصيل في بلطيم 🚀</span>
  </header>

  <h2 style="margin-bottom: 15px; color:#f59e0b;">قائمة الطعام (المنيو)</h2>
  <div id="menuContainer" class="menu-grid">
    <p style="color:#94a3b8;">جاري تحميل المنيو...</p>
  </div>
</div>

<script>
  async function loadMenu() {
    const container = document.getElementById('menuContainer');
    try {
      const res = await fetch('/api/menu');
      const menu = await res.json();

      if (!menu || menu.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8;">لا توجد وجبات في المنيو حالياً.</p>';
        return;
      }

      container.innerHTML = menu.map(item => `
        <div class="menu-card">
          <h3>${item.name}</h3>
          <p style="color:#94a3b8; font-size:12px;">${item.category || 'عام'}</p>
          <div class="price">${item.price} ج.م</div>
          <button class="btn" onclick="placeOrder('${item.name}')">طلب الآن 🛒</button>
        </div>
      `).join('');
    } catch (err) {
      container.innerHTML = '<p style="color:#ef4444;">خطأ في تحميل المنيو.</p>';
    }
  }

  async function placeOrder(itemName) {
    const name = prompt('أدخل اسمك الكريم:');
    if (!name) return;
    const phone = prompt('أدخل رقم جوالك:');
    if (!phone) return;

    try {
      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customerName: name, phone: phone, item: itemName })
      });

      if (res.ok) {
        alert('تم إرسال طلبك بنجاح! يتم تجهيزه الآن 🚀');
      }
    } catch (err) {
      alert('حدث خطأ في إرسال الطلب');
    }
  }

  document.addEventListener('DOMContentLoaded', loadMenu);
</script>
</body>
</html>
