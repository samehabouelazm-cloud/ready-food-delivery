<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>READY OS - طلب الطعام المباشر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #f59e0b;
            --accent-hover: #d97706;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --success-color: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 80px; }

        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 22px; font-weight: 800; color: var(--accent-color); }

        .cart-btn-header {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
        }

        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .menu-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-title { font-size: 16px; font-weight: 700; margin-bottom: 5px; }
        .item-price { color: var(--accent-color); font-weight: 800; margin-bottom: 15px; }

        .add-btn {
            background-color: var(--border-color);
            color: var(--text-color);
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-btn:hover { background-color: var(--accent-color); color: #000; }

        /* Modal / Cart Drawer */
        .cart-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .cart-modal.active { display: flex; }

        .cart-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .cart-title { font-size: 18px; font-weight: 800; margin-bottom: 15px; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 5px; }
        .form-control {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 14px;
        }

        .payment-methods {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .pay-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .pay-btn.selected {
            border-color: var(--accent-color);
            background-color: rgba(245, 158, 11, 0.1);
            color: var(--accent-color);
        }

        .submit-order-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--success-color);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-order-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .close-cart {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            float: left;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">READY OS 🍕</div>
        <button class="cart-btn-header" onclick="toggleCart()">السلة (<span id="cart-count">0</span>)</button>
    </header>

    <div class="container">
        <h2 style="margin-bottom: 20px;">القائمة المميزة</h2>
        <div class="menu-grid" id="menu-container"></div>
    </div>

    <!-- نافذة السلة وتأكيد الطلب -->
    <div class="cart-modal" id="cart-modal">
        <div class="cart-content">
            <button class="close-cart" onclick="toggleCart()">✕</button>
            <div class="cart-title">تفاصيل الطلب والدفع</div>

            <div id="cart-items-list" style="margin-bottom: 15px;"></div>

            <div class="form-group">
                <label>اسم العميل (اختياري)</label>
                <input type="text" id="customer-name" class="form-control" placeholder="أدخل اسمك">
            </div>

            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="tel" id="customer-phone" class="form-control" placeholder="01000000000">
            </div>

            <div class="form-group">
                <label>طريقة الدفع:</label>
                <div class="payment-methods">
                    <button class="pay-btn selected" onclick="selectPayment('cash', this)">💵 كاش</button>
                    <button class="pay-btn" onclick="selectPayment('visa', this)">💳 فيزا</button>
                    <button class="pay-btn" onclick="selectPayment('wallet', this)">📱 محفظة</button>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 18px; margin: 15px 0;">
                <span>الإجمالي:</span>
                <span id="cart-total-price">0.00 ج.م</span>
            </div>

            <button class="submit-order-btn" id="submit-btn" onclick="submitOrder()">تأكيد الطلب والدفع 🚀</button>
        </div>
    </div>

    <script>
        const menuItems = [
            { id: "1", name: "طاجن جمبري الكريمة", price: 480 },
            { id: "2", name: "وجبة سي فود ميكس", price: 650 },
            { id: "3", name: "بيتزا مأكولات بحرية", price: 320 },
            { id: "4", name: "وجبة سمك دنيس مشوي", price: 400 }
        ];

        let cart = [];
        let selectedPayment = 'cash';

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = menuItems.map(item => `
                <div class="menu-card">
                    <div>
                        <div class="item-title">${item.name}</div>
                        <div class="item-price">${item.price.toFixed(2)} ج.م</div>
                    </div>
                    <button class="add-btn" onclick="addToCart('${item.id}')">إضافة للسلة +</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const item = menuItems.find(m => m.id === id);
            const existing = cart.find(c => c.id === id);

            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...item, quantity: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-total-price').innerText = total.toFixed(2) + " ج.م";

            const listContainer = document.getElementById('cart-items-list');
            if (cart.length === 0) {
                listContainer.innerHTML = '<p style="color: var(--text-secondary); text-align:center;">السلة فارغة</p>';
            } else {
                listContainer.innerHTML = cart.map(i => `
                    <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:14px;">
                        <span>${i.name} (x${i.quantity})</span>
                        <span>${(i.price * i.quantity).toFixed(2)} ج.م</span>
                    </div>
                `).join('');
            }
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('active');
        }

        function selectPayment(method, btn) {
            selectedPayment = method;
            document.querySelectorAll('.pay-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        // ==================== دالة إرسال الطلب المعالجة لتفادي الانهيار ====================
        async function submitOrder() {
            if (cart.length === 0) {
                alert("برجاء إضافة عناصر إلى السلة أولاً!");
                return;
            }

            const nameInput = document.getElementById('customer-name').value.trim();
            const phoneInput = document.getElementById('customer-phone').value.trim();
            const submitBtn = document.getElementById('submit-btn');

            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            const orderData = {
                customerName: nameInput || 'عميل جديد',
                customerPhone: phoneInput || '',
                paymentMethod: selectedPayment,
                items: cart,
                totalAmount: totalAmount,
                status: 'pending'
            };

            submitBtn.disabled = true;
            submitBtn.innerText = "جاري إرسال الطلب... ⏳";

            try {
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                // قراءة الاستجابة كنص أولاً لتجنب Unexpected token 'A'
                const rawText = await response.text();
                let result;

                try {
                    result = JSON.parse(rawText);
                } catch (e) {
                    throw new Error("استجابة غير المتوقعة من السيرفر: " + rawText.substring(0, 80));
                }

                if (response.ok && (result.success || result._id || result.order)) {
                    alert("🎉 تم إرسال الطلب بنجاح!");
                    cart = [];
                    updateCartUI();
                    toggleCart();
                    document.getElementById('customer-name').value = '';
                    document.getElementById('customer-phone').value = '';
                } else {
                    const errorMsg = result.error || result.message || "حدث خطأ في حفظ الطلب";
                    throw new Error(errorMsg);
                }
            } catch (error) {
                console.error("خطأ في إرسال الطلب:", error);
                alert("❌ فشل إرسال الطلب: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "تأكيد الطلب والدفع 🚀";
            }
        }

        renderMenu();
        updateCartUI();
    </script>
</body>
</html>
