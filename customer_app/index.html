<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>READY - متابعة الطلب</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- استدعاء مكتبة Socket.io -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700 text-center">
    <h1 class="text-2xl font-bold text-amber-500 mb-2">تطبيق READY 🍔</h1>
    <p class="text-slate-400 text-sm mb-6">متابعة حالة الطلب اللحظية</p>

    <!-- بطاقة عرض حالة الطلب -->
    <div id="order-card" class="bg-slate-900 p-4 rounded-xl border border-slate-700 mb-4">
      <p class="text-xs text-slate-500 mb-1">رقم الطلب:</p>
      <p id="order-id" class="font-mono text-sm text-slate-300 mb-3">لم يتم إنشاء طلب بعد</p>
      
      <p class="text-xs text-slate-500 mb-1">حالة الطلب الحالية:</p>
      <span id="order-status" class="inline-block px-3 py-1 rounded-full text-sm font-semibold bg-slate-700 text-slate-300">
        بانتظار الطلب...
      </span>
    </div>

    <button id="btn-create-order" onclick="createOrder()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-xl transition">
      إنشاء طلب تجريبي جديد 🚀
    </button>
  </div>

  <script>
    const socket = io(); 
    let currentOrderId = null;

    // استقبال التحديث اللحظي المباشر بدلاً من الـ Polling
    socket.on('order_status_updated', (data) => {
      console.log('تحديث حالة وصل:', data);
      if (data.orderId === currentOrderId) {
        updateStatusUI(data.status);
      }
    });

    async function createOrder() {
      const btn = document.getElementById('btn-create-order');
      btn.disabled = true;
      btn.innerText = 'جاري إرسال الطلب...';

      try {
        const response = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            customerName: "عميل تجريبي",
            items: [{ name: "وجبة برجر ممتازة", quantity: 1, price: 150 }],
            totalAmount: 150,
            status: "معلق"
          })
        });

        const result = await response.json();
        
        if (result.success) {
          currentOrderId = result.data._id;
          document.getElementById('order-id').innerText = currentOrderId;
          updateStatusUI(result.data.status);

          // الانضمام لغرفة هذا الطلب لاستقبال تحديثاته
          socket.emit('join_order', currentOrderId);
        }
      } catch (err) {
        alert('حدث خطأ أثناء إنشاء الطلب');
      } finally {
        btn.disabled = false;
        btn.innerText = 'إنشاء طلب تجريبي جديد 🚀';
      }
    }

    function updateStatusUI(status) {
      const statusElement = document.getElementById('order-status');
      statusElement.innerText = status;

      statusElement.className = "inline-block px-3 py-1 rounded-full text-sm font-bold ";
      if (status === 'معلق') {
        statusElement.className += "bg-yellow-500/20 text-yellow-400 border border-yellow-500/30";
      } else if (status === 'قيد التحضير') {
        statusElement.className += "bg-blue-500/20 text-blue-400 border border-blue-500/30";
      } else if (status === 'جاري التوصيل') {
        statusElement.className += "bg-purple-500/20 text-purple-400 border border-purple-500/30";
      } else if (status === 'تم التسليم') {
        statusElement.className += "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
      } else {
        statusElement.className += "bg-slate-700 text-slate-300";
      }
    }
  </script>
</body>
</html>
