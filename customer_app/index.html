<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>READY OS - طلب الطعام</title>
    <!-- تضمين مكتبة Leaflet للخريطة التفاعلية -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 15px; padding-bottom: 80px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #334155; margin-bottom: 20px; }
        .brand { font-size: 22px; font-weight: bold; color: #f59e0b; }
        .status-badge { font-size: 13px; padding: 4px 10px; border-radius: 20px; font-weight: bold; }
        .open { background: #10b98122; color: #10b981; border: 1px solid #10b981; }
        .closed { background: #ef444422; color: #ef4444; border: 1px solid #ef4444; }
        
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }
        .card img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
        .card-title { font-weight: bold; font-size: 15px; color: #f1f5f9; }
        .card-price { color: #10b981; font-weight: bold; margin-top: 4px; }
        .btn-add { background: #f59e0b; color: #0f172a; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; width: 100%; }

        .checkout-section { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 15px; margin-bottom: 25px; }
        .checkout-section h3 { color: #f59e0b; margin-bottom: 12px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
        #map { height: 160px; border-radius: 8px; border: 1px solid #334155; margin-top: 8px; }

        .cart-summary { background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 12px; border: 1px dashed #334155; }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; }
        .btn-submit { background: #10b981; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; }

        .active-order { background: #1e293b; border: 1px solid #f59e0b; border-radius: 12px; padding: 15px; margin-top: 20px; }
        .order-step { display: flex; align-items: center; margin-top: 10px; gap: 10px; font-size: 14px; color: #94a3b8; }
        .step-active { color: #10b981; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">🍔 READY OS</div>
        <div id="storeStatus" class="status-badge open">جاري التحقق...</div>
    </div>

    <!-- قائمة الطعام -->
    <h3 style="margin-bottom: 12px; color: #cbd5e1;">📋 المنيو</h3>
    <div id="menuContainer" class="menu-grid">
        <p style="color:#94a3b8;">جاري تحميل القائمة...</p>
    </div>

    <!-- إتمام الطلب -->
    <div class="checkout-section">
        <h3>🛒 إتمام الطلب</h3>
        <div class="cart-summary" id="cartSummary">
            <p style="color:#94a3b8; font-size:13px;">السلة فارغة، اختر من المنيو أعلاه.</p>
        </div>

        <div class="form-group">
            <label>اسمك الكريم</label>
            <input type="text" id="custName" placeholder="أدخل اسمك الكامل">
        </div>
        <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="tel" id="custPhone" placeholder="01xxxxxxxxx">
        </div>
        <div class="form-group">
            <label>ملاحظات إضافية (مثل: بدون بصل، صوص خارجي)</label>
            <textarea id="custNotes" rows="2" placeholder="اكتب أي ملاحظة تخص الوجبة أو التوصيل..."></textarea>
        </div>
        <div class="form-group">
            <label>تحديد موقع التوصيل على الخريطة</label>
            <div id="map"></div>
        </div>

        <button class="btn-submit" onclick="submitOrder()">تأكيد وإرسال الطلب 🚀</button>
    </div>

    <!-- تتبع الطلب الحالي -->
    <div id="activeOrderSection" class="active-order" style="display:none;">
        <h3 style="color:#f59e0b; margin-bottom:8px;">📡 تتبع طلبك الحالي</h3>
        <div id="orderStatusText" style="font-weight:bold; color:#10b981; margin-bottom:10px;">جاري معالجة الطلب...</div>
        <div class="order-step" id="stepPending">1. 🟡 جاري التجهيز والتحضير</div>
        <div class="order-step" id="stepDelivering">2. 🛵 الطلب في الطريق مع الكابتن</div>
        <div class="order-step" id="stepCompleted">3. 🟢 تم التوصيل بنجاح</div>
        <div id="driverInfo" style="margin-top:10px; font-size:13px; color:#cbd5e1;"></div>
    </div>

<script>
  let currentOrderId = null;
  let trackingInterval = null;

  // عند الضغط على زر "تأكيد وإرسال الطلب"
  document.getElementById('orderForm')?.addEventListener('submit', async function(e) {
      e.preventDefault();

      const customerName = document.getElementById('customerName')?.value || 'عميل تجريبي';
      const customerPhone = document.getElementById('customerPhone')?.value || '01000000000';
      const notes = document.getElementById('orderNotes')?.value || '';

      const orderData = {
          customerName,
          phone: customerPhone,
          notes,
          items: JSON.parse(localStorage.getItem('cart') || '[]'),
          status: 'قيد التحضير في المطبخ',
          createdAt: new Date().toISOString()
      };

      try {
          const response = await fetch('/api/orders', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(orderData)
          });

          if (!response.ok) throw new Error('فشل إرسال الطلب');

          const data = await response.json();
          currentOrderId = data.id || data._id;
          
          // حفظ رقم الطلب في التخزين المحلي
          localStorage.setItem('currentOrderId', currentOrderId);

          alert(`تم إرسال الطلب بنجاح! رقم الطلب: ${currentOrderId}`);

          // إظهار قسم التتبع وإضافة زر الانتقال السريع
          showTrackingUI(currentOrderId);

          // بدء التتبع التلقائي اللحظي كل 3 ثوانٍ
          startLiveTracking(currentOrderId);

      } catch (error) {
          console.error('Error submitting order:', error);
          alert('حدث خطأ أثناء إرسال الطلب. تأكد من فتح الرابط عبر سيرفر Vercel!');
      }
  });

  // دالة بدء التتبع اللحظي للطلب
  function startLiveTracking(orderId) {
      if (trackingInterval) clearInterval(trackingInterval);

      trackingInterval = setInterval(async () => {
          try {
              const res = await fetch(`/api/orders/${orderId}`);
              if (!res.ok) return;
              const order = await res.json();

              updateStatusUI(order.status);
          } catch (err) {
              console.error('Error fetching order tracking status:', err);
          }
      }, 3000);
  }

  // تحديث حالة الطلب في الواجهة
  function updateStatusUI(status) {
      const statusElement = document.getElementById('orderStatus');
      if (statusElement) {
          statusElement.innerText = status;
      }

      // ألوان ومؤشرات حسب حالة الطلب
      const step1 = document.getElementById('step1');
      const step2 = document.getElementById('step2');

      if (status === 'قيد التحضير في المطبخ') {
          if (step1) step1.style.color = '#e67e22';
      } else if (status === 'في الطريق مع الكابتن') {
          if (step1) step1.style.color = '#2ecc71';
          if (step2) step2.style.color = '#e67e22';
      } else if (status === 'تم التوصيل بنجاح' || status === 'تم التوصيل') {
          if (step1) step1.style.color = '#2ecc71';
          if (step2) step2.style.color = '#2ecc71';
          clearInterval(trackingInterval); // إيقاف المتابعة بعد اكتمال التوصيل
      }
  }

  // إظهار واجهة التتبع وأزرار التحويل السريع للتجربة
  function showTrackingUI(orderId) {
      let trackerBox = document.getElementById('quickTrackerBox');
      if (!trackerBox) {
          trackerBox = document.createElement('div');
          trackerBox.id = 'quickTrackerBox';
          trackerBox.style.cssText = 'margin-top:20px; padding:15px; background:#1e293b; border-radius:10px; color:#fff; text-align:center;';
          
          const orderForm = document.getElementById('orderForm') || document.body;
          orderForm.parentNode.insertBefore(trackerBox, orderForm.nextSibling);
      }

      trackerBox.innerHTML = `
          <h3 style="color:#2ecc71; margin-bottom:10px;">🚀 جارٍ تتبع الطلب رقم: ${orderId}</h3>
          <p>الحالة الحالية: <strong id="orderStatus" style="color:#f39c12;">قيد التحضير في المطبخ</strong></p>
          <hr style="border-color:#334155; margin:15px 0;">
          <p style="font-size:14px; color:#cbd5e1;">لتجربة الدورة الكاملة وإسناد الطلب للكابتن:</p>
          <div style="display:flex; gap:10px; justify-content:center; margin-top:10px;">
              <a href="/admin.html" target="_blank" style="background:#3b82f6; color:#fff; padding:8px 15px; border-radius:5px; text-decoration:none; font-weight:bold;">فتح لوحة الأدمن 🛠️</a>
              <a href="/driver.html" target="_blank" style="background:#10b981; color:#fff; padding:8px 15px; border-radius:5px; text-decoration:none; font-weight:bold;">فتح تطبيق الكابتن 🚴</a>
          </div>
      `;
  }
</script>
