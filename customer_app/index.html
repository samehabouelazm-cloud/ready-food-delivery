<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>READY OS - اطلب طعامك طازجاً</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20 select-none">

  <!-- الهيدر -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 p-4 shadow-lg">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-black text-amber-400">READY OS 🍕</h1>
      <div class="flex items-center space-x-4 space-x-reverse">
        <span id="cart-count" class="bg-amber-500 text-slate-900 font-bold px-3 py-1 rounded-full text-xs">
          السلة (0)
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-8 mt-4">
    <!-- قائمة المأكولات (Menu) -->
    <section>
      <h2 class="text-lg font-bold text-slate-200 mb-4">قائمة الوجبات المتاحة 🔥</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="menu-container">
        
        <!-- صنف 1 -->
        <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex justify-between items-center">
          <div>
            <h3 class="font-bold text-slate-100">جمبري بلدي جامبو</h3>
            <p class="text-xs text-slate-400 mt-1">مشوي بالخلطة الخاصة 500 جرام</p>
            <span class="text-emerald-400 font-bold text-sm block mt-2">1200 ج.م</span>
          </div>
          <button data-name="جمبري بلدي جامبو" data-price="1200" class="add-btn bg-amber-500 active:bg-amber-700 hover:bg-amber-600 text-slate-900 font-bold text-xs px-4 py-3 rounded-xl transition touch-manipulation">
            + إضافة
          </button>
        </div>

        <!-- صنف 2 -->
        <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex justify-between items-center">
          <div>
            <h3 class="font-bold text-slate-100">دنيس طازج مشوي</h3>
            <p class="text-xs text-slate-400 mt-1">سمكة دنيس طازجة مع الأرز والسلطة</p>
            <span class="text-emerald-400 font-bold text-sm block mt-2">802.20 ج.م</span>
          </div>
          <button data-name="دنيس طازج مشوي" data-price="802.20" class="add-btn bg-amber-500 active:bg-amber-700 hover:bg-amber-600 text-slate-900 font-bold text-xs px-4 py-3 rounded-xl transition touch-manipulation">
            + إضافة
          </button>
        </div>

      </div>
    </section>

    <!-- ملخص السلة والتأكيد -->
    <section class="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
      <h2 class="text-base font-bold text-slate-200 border-b border-slate-700 pb-2">تفاصيل الطلب 🛒</h2>
      
      <div id="cart-items" class="space-y-2 text-sm text-slate-300">
        <p class="text-xs text-slate-500">السلة فارغة حالياً..</p>
      </div>

      <div class="flex justify-between items-center pt-4 border-t border-slate-700 font-bold">
        <span>الإجمالي:</span>
        <span id="total-price" class="text-emerald-400 text-lg">0 ج.م</span>
      </div>

      <button id="checkout-btn" disabled class="w-full bg-slate-700 text-slate-400 font-bold py-3 rounded-xl transition cursor-not-allowed">
        تأكيد الطلب والدفع 🚀
      </button>
    </section>
  </main>

  <script>
    let cart = [];

    document.addEventListener('DOMContentLoaded', () => {
      // ربط جميع أزرار الإضافة بحدث الضغط بأمان
      document.querySelectorAll('.add-btn').forEach(button => {
        button.addEventListener('click', (e) => {
          e.preventDefault();
          const name = button.getAttribute('data-name');
          const price = parseFloat(button.getAttribute('data-price'));
          addToCart(name, price);
        });
      });

      document.getElementById('checkout-btn').addEventListener('click', submitOrder);
    });

    function addToCart(name, price) {
      cart.push({ name, price });
      updateCartUI();
    }

    function updateCartUI() {
      const cartContainer = document.getElementById('cart-items');
      const cartCount = document.getElementById('cart-count');
      const totalPrice = document.getElementById('total-price');
      const checkoutBtn = document.getElementById('checkout-btn');

      cartCount.textContent = `السلة (${cart.length})`;

      if (cart.length === 0) {
        cartContainer.innerHTML = '<p class="text-xs text-slate-500">السلة فارغة حالياً..</p>';
        totalPrice.textContent = '0 ج.م';
        checkoutBtn.disabled = true;
        checkoutBtn.className = "w-full bg-slate-700 text-slate-400 font-bold py-3 rounded-xl transition cursor-not-allowed";
        return;
      }

      let total = 0;
      cartContainer.innerHTML = cart.map(item => {
        total += item.price;
        return `<div class="flex justify-between py-1 border-b border-slate-700/50"><span>${item.name}</span><span class="font-mono text-emerald-400">${item.price} ج.م</span></div>`;
      }).join('');

      totalPrice.textContent = `${total.toFixed(2)} ج.م`;
      checkoutBtn.disabled = false;
      checkoutBtn.className = "w-full bg-emerald-500 active:bg-emerald-700 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition cursor-pointer shadow-lg touch-manipulation";
    }

    async function submitOrder() {
      if (cart.length === 0) return;

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      const orderData = {
        customerName: "عميل تجريبي",
        items: cart,
        totalAmount: total
      };

      try {
        const response = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });

        const res = await response.json();
        if (res.success) {
          alert('✅ تم إرسال الطلب بنجاح وهو قيد التحضير الآن!');
          cart = [];
          updateCartUI();
        }
      } catch (err) {
        alert('❌ حدث خطأ أثناء إرسال الطلب');
      }
    }
  </script>
</body>
</html>
