<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>READY OS - تطبيق الكابتن</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; line-height: 1.6; }
    .container { max-width: 700px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 25px; padding: 15px; background: #1e293b; border-radius: 12px; border: 1px solid #334155; }
    header h1 { color: #10b981; font-size: 24px; }
    .section-card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
    .section-title { font-size: 18px; color: #38bdf8; margin-bottom: 15px; }
    .form-control { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 16px; margin-bottom: 15px; }
    .order-card { background: #0f172a; border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; }
    .order-header { display: flex; justify-content: space-between; border-bottom: 1px solid #1e293b; padding-bottom: 8px; margin-bottom: 10px; }
    .btn { padding: 10px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #10b981; color: #fff; width: 100%; margin-top: 10px; }
    .btn:hover { background: #059669; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🚴 بوابة الكابتن</h1>
  </header>

  <div class="section-card">
    <div class="section-title">اختر حساب الكابتن الحالي:</div>
    <select id="driverSelect" class="form-control" onchange="loadDriverOrders()">
      <option value="">جاري تحميل الكباتن...</option>
    </select>
  </div>

  <div class="section-card">
    <div class="section-title">📦 الطلبات الموكلة إليك</div>
    <div id="ordersContainer">
      <p style="color: #94a3b8;">اختر كابتن لعرض الطلبات.</p>
    </div>
  </div>
</div>

<script>
  let currentDriverId = null;

  // 1. جلب قائمة الكباتن عند فتح الصفحة
  async function loadDrivers() {
    try {
      const res = await fetch('/api/drivers');
      if (!res.ok) throw new Error('Network error');
      const drivers = await res.json();

      const select = document.getElementById('driverSelect');
      if (!drivers || drivers.length === 0) {
        select.innerHTML = '<option value="">لا يوجد كباتن مسجلين</option>';
        return;
      }

      select.innerHTML = '<option value="">-- اختر الكابتن --</option>' + 
        drivers.map(d => `<option value="${d.id}">${d.name} (${d.phone})</option>`).join('');
    } catch (err) {
      document.getElementById('driverSelect').innerHTML = '<option value="">خطأ في تحميل الكباتن</option>';
    }
  }

  // 2. جلب الطلبات الموكلة للكابتن المختار
  async function loadDriverOrders() {
    const select = document.getElementById('driverSelect');
    currentDriverId = select.value;
    const container = document.getElementById('ordersContainer');

    if (!currentDriverId) {
      container.innerHTML = '<p style="color: #94a3b8;">اختر كابتن لعرض الطلبات.</p>';
      return;
    }

    try {
      const res = await fetch('/api/orders');
      const allOrders = await res.json();
      
      // تصفية الطلبات الخاصة بهذا الكابتن فقط
      const driverOrders = allOrders.filter(o => o.driverId == currentDriverId);

      if (driverOrders.length === 0) {
        container.innerHTML = '<p style="color: #94a3b8;">لا توجد طلبات موكلة إليك حالياً.</p>';
        return;
      }

      container.innerHTML = driverOrders.map(order => `
        <div class="order-card">
          <div class="order-header">
            <strong style="color:#f59e0b;">طلب #${order.id}</strong>
            <span style="color:#10b981;">${order.status}</span>
          </div>
          <p><strong>العميل:</strong> ${order.customerName || 'غير محدد'} (${order.phone || '-'})</p>
          <p><strong>العنوان:</strong> ${order.address || 'محدد بالإحداثيات'}</p>
          <p><strong>المبلغ المطلوب:</strong> ${order.total || 0} ج.م</p>
          ${order.status !== 'تم التسليم' ? `
            <button class="btn" onclick="markAsDelivered('${order.id}')">تأكيد تسليم الطلب ✅</button>
          ` : '<p style="color:#10b981; font-weight:bold; margin-top:10px;">تم تسليم هذا الطلب بنجاح 👍</p>'}
        </div>
      `).join('');
    } catch (err) {
      container.innerHTML = '<p style="color: #ef4444;">حدث خطأ أثناء جلب الطلبات.</p>';
    }
  }

  // 3. تحديث حالة الطلب إلى "تم التسليم"
  async function markAsDelivered(orderId) {
    try {
      const res = await fetch(`/api/orders/${orderId}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'تم التسليم' })
      });

      if (res.ok) {
        alert('تم تحديث حالة الطلب إلى تم التسليم!');
        loadDriverOrders();
      }
    } catch (err) {
      alert('حدث خطأ أثناء تحديث الحالة.');
    }
  }

  document.addEventListener('DOMContentLoaded', loadDrivers);
</script>
</body>
</html>
