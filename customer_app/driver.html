<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>READY OS - تطبيق الكابتن</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4">

  <header class="bg-slate-800 p-4 rounded-2xl border border-slate-700 mb-6 flex justify-between items-center shadow-lg">
    <h1 class="text-lg font-black text-amber-400">لوحة الكابتن 🚴‍♂️</h1>
    <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs px-3 py-1 rounded-full font-bold">
      متصل بالشبكة
    </span>
  </header>

  <main class="max-w-2xl mx-auto space-y-4">
    <h2 class="text-sm font-bold text-slate-400">الطلبات المتاحة للتوصيل 📦</h2>
    <div id="orders-container" class="space-y-4">
      <p class="text-xs text-slate-500 text-center py-8">في انتظار طلبات جديدة...</p>
    </div>
  </main>

  <script>
    const socket = io();

    // الاستماع للطلبات الجديدة اللحظية
    socket.on('new_order_available', (order) => {
      renderOrderCard(order);
      alert('🔔 طلب جديد وصل!');
    });

    // الاستماع لتحديثات الحالة
    socket.on('order_status_updated', (data) => {
      const statusElement = document.getElementById(`status-${data.orderId}`);
      if (statusElement) {
        statusElement.textContent = data.status;
      }
    });

    function renderOrderCard(order) {
      const container = document.getElementById('orders-container');
      
      // إزالة رسالة الانتظار عند أول طلب
      if (container.querySelector('p')) {
        container.innerHTML = '';
      }

      const card = document.createElement('div');
      card.className = "bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-3 shadow-md";
      card.id = `order-card-${order._id}`;

      card.innerHTML = `
        <div class="flex justify-between items-center border-b border-slate-700 pb-2">
          <span class="font-bold text-amber-400">طلب #${order._id.slice(-6)}</span>
          <span id="status-${order._id}" class="bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs px-2.5 py-1 rounded-lg font-bold">
            ${order.status}
          </span>
        </div>

        <div class="text-xs text-slate-300 space-y-1">
          <p><strong class="text-slate-400">العميل:</strong> ${order.customerName || 'عميل تجريبي'}</p>
          <p><strong class="text-slate-400">المبلغ:</strong> <span class="text-emerald-400 font-mono font-bold">${order.totalAmount} ج.م</span></p>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-2">
          <button onclick="updateStatus('${order._id}', 'جاري التوصيل')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-2 rounded-xl transition">
            🚴‍♂️ جاري التوصيل
          </button>
          <button onclick="updateStatus('${order._id}', 'تم التسليم')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2 rounded-xl transition">
            ✅ تم التسليم
          </button>
        </div>
      `;

      container.prepend(card);
    }

    async function updateStatus(orderId, status) {
      try {
        const response = await fetch(`/api/orders/${orderId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        const res = await response.json();
        if (!res.success) {
          alert('❌ فشل تحديث الحالة');
        }
      } catch (err) {
        console.error(err);
      }
    }
  </script>
</body>
</html>
