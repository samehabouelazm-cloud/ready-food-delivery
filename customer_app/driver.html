<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاهز في بلطيم - تطبيق الكابتن</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 20px; background: #1e293b; padding: 15px; border-radius: 12px; border: 1px solid #334155; }
    header h1 { color: #10b981; font-size: 22px; }
    
    .order-card { background: #1e293b; border-radius: 12px; padding: 18px; margin-bottom: 15px; border: 1px solid #334155; }
    .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 12px; }
    .status-badge { background: #f59e0b; color: #000; font-weight: bold; padding: 4px 10px; border-radius: 6px; font-size: 13px; }
    .status-done { background: #10b981; color: #fff; }

    .action-btn { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
    .btn-step1 { background: #3b82f6; color: #fff; }
    .btn-step2 { background: #8b5cf6; color: #fff; }
    .btn-step3 { background: #f59e0b; color: #000; }
    .btn-step4 { background: #10b981; color: #fff; }
    .action-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🚴 جاهز في بلطيم - تطبيق الكابتن</h1>
    <p style="color:#94a3b8; font-size:13px; margin-top:5px;">متابعة الرحلة وتحديث حالة التوصيل</p>
  </header>

  <div id="driverOrders">
    <p style="color: #94a3b8; text-align:center;">جاري تحميل الطلبات...</p>
  </div>
</div>

<script>
  async function loadMyOrders() {
    const container = document.getElementById('driverOrders');
    try {
      const res = await fetch('/api/orders');
      const orders = await res.json();

      if (!orders || orders.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8; text-align:center;">لا توجد طلبات حالياً.</p>';
        return;
      }

      container.innerHTML = orders.map(o => {
        const isCompleted = o.status.includes('تم التوصيل بنجاح');
        return `
          <div class="order-card">
            <div class="order-header">
              <h3>طلب #${o.id}</h3>
              <span class="status-badge ${isCompleted ? 'status-done' : ''}">${o.status}</span>
            </div>
            <p><strong>العميل:</strong> ${o.customerName || 'عميل'} (${o.phone || '-'})</p>
            <p><strong>العنوان/الوجبة:</strong> ${o.item || 'وجبة طعام'}</p>
            <p style="margin-top:6px; font-size:12px; color:#94a3b8;"><strong>التاريخ:</strong> ${new Date(o.createdAt).toLocaleString('ar-EG')}</p>
            
            ${!isCompleted ? renderActionButtons(o.id, o.status) : '<p style="color:#10b981; text-align:center; margin-top:10px; font-weight:bold;">🎉 تم توصيل هذا الطلب بنجاح</p>'}
          </div>
        `;
      }).join('');
    } catch (err) {
      container.innerHTML = '<p style="color:#ef4444; text-align:center;">خطأ في جلب البيانات.</p>';
    }
  }

  // تحديد الزر التالي بناءً على حالة الطلب الحالية
  function renderActionButtons(orderId, currentStatus) {
    if (currentStatus.includes('جاري التوصيل مع')) {
      return `<button class="action-btn btn-step1" onclick="updateOrderStatus('${orderId}', '👨‍🍳 الكابتن في الطريق للمطعم')">👨‍🍳 التحرك إلى المطعم</button>`;
    } else if (currentStatus.includes('في الطريق للمطعم')) {
      return `<button class="action-btn btn-step2" onclick="updateOrderStatus('${orderId}', '🛍️ تم استلام الطلب من المطعم')">🛍️ تم استلام الطلب</button>`;
    } else if (currentStatus.includes('تم استلام الطلب')) {
      return `<button class="action-btn btn-step3" onclick="updateOrderStatus('${orderId}', '🚴 الكابتن في الطريق للعميل')">🚴 التحرك إلى موقع العميل</button>`;
    } else if (currentStatus.includes('في الطريق للعميل')) {
      return `<button class="action-btn btn-step4" onclick="updateOrderStatus('${orderId}', '✅ تم التوصيل بنجاح')">✅ تأكيد التوصيل وتسليم الطلب</button>`;
    } else {
      return `<button class="action-btn btn-step1" onclick="updateOrderStatus('${orderId}', '👨‍🍳 الكابتن في الطريق للمطعم')">تحديث الحالة</button>`;
    }
  }

  // تحديث الحالة إلكترونياً
  async function updateOrderStatus(orderId, newStatus) {
    try {
      const res = await fetch(`/api/orders/${orderId}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      });

      if (res.ok) {
        await loadMyOrders();
      } else {
        alert('حدث خطأ أثناء تحديث الحالة');
      }
    } catch (err) {
      alert('خطأ في الاتصال بالسيرفر');
    }
  }

  document.addEventListener('DOMContentLoaded', loadMyOrders);
</script>
</body>
</html>
