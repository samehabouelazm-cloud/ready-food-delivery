<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاهز في بلطيم - تطبيق الكابتن</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 20px; background: #1e293b; padding: 15px; border-radius: 12px; border: 1px solid #334155; }
    header h1 { color: #10b981; font-size: 22px; }
    .order-card { background: #1e293b; border-radius: 10px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; }
    .status { font-size: 14px; font-weight: bold; color: #f59e0b; margin-top: 5px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🚴 جاهز في بلطيم - تطبيق الكابتن</h1>
    <p style="color:#94a3b8; font-size:13px; margin-top:5px;">قائمة الطلبات المسندة إليك</p>
  </header>

  <div id="driverOrders">
    <p style="color: #94a3b8; text-align:center;">جاري تحميل الطلبات المكلفة...</p>
  </div>
</div>

<script>
  async function loadMyOrders() {
    const container = document.getElementById('driverOrders');
    try {
      const res = await fetch('/api/orders');
      const orders = await res.json();

      if (!orders || orders.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8; text-align:center;">لا توجد طلبات حالياً.</p>';
        return;
      }

      container.innerHTML = orders.map(o => `
        <div class="order-card">
          <h3>طلب #${o.id}</h3>
          <p class="status">الحالة: ${o.status}</p>
          <p style="margin-top:8px;"><strong>تاريخ الطلب:</strong> ${new Date(o.createdAt).toLocaleString('ar-EG')}</p>
        </div>
      `).join('');
    } catch (err) {
      container.innerHTML = '<p style="color:#ef4444; text-align:center;">خطأ في جلب البيانات.</p>';
    }
  }

  document.addEventListener('DOMContentLoaded', loadMyOrders);
</script>
</body>
</html>
