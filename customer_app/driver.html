<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>READY OS - تطبيق الكابتن</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 20px; padding: 15px; background: #1e293b; border-radius: 12px; }
    header h1 { color: #10b981; font-size: 24px; }
    .card { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #334155; }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .btn-success { background: #10b981; color: #fff; }
    select { width: 100%; padding: 10px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 6px; margin-bottom: 15px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🚴 بوابة الكابتن</h1>
  </header>

  <div class="card">
    <label style="display:block; margin-bottom:8px;">اختر حساب الكابتن الحالي:</label>
    <select id="driverSelect" onchange="loadDriverOrders()">
      <option value="">جاري تحميل الكباتن...</option>
    </select>
  </div>

  <h3 style="margin-bottom: 10px; color: #38bdf8;">📦 الطلبات الموكلة إليك</h3>
  <div id="ordersContainer">
    <p style="color: #64748b;">اختر كابتن لعرض الطلبات.</p>
  </div>
</div>

<script>
  async function loadDrivers() {
    try {
      const res = await fetch('/api/drivers');
      const drivers = await res.json();
      const select = document.getElementById('driverSelect');
      select.innerHTML = '<option value="">-- اختر حسابك --</option>' + 
        drivers.map(d => `<option value="${d.id}">${d.name} (${d.status})</option>`).join('');
    } catch (err) {
      console.error('Error loading drivers:', err);
    }
  }

  async function loadDriverOrders() {
    const driverId = document.getElementById('driverSelect').value;
    const container = document.getElementById('ordersContainer');
    if (!driverId) {
      container.innerHTML = '<p style="color: #64748b;">اختر كابتن لعرض الطلبات.</p>';
      return;
    }

    try {
      const res = await fetch('/api/orders');
      const orders = await res.json();
      const assignedOrders = orders.filter(o => o.driverId == driverId || o.status === 'في الطريق مع الكابتن');

      if (assignedOrders.length === 0) {
        container.innerHTML = '<p style="color: #94a3b8;">لا توجد طلبات معلقة حالياً لهذا الكابتن.</p>';
        return;
      }

      container.innerHTML = assignedOrders.map(order => `
        <div class="card">
          <h4>طلب #${order.id || order._id}</h4>
          <p><strong>العميل:</strong> ${order.customerName}</p>
          <p><strong>الهاتف:</strong> ${order.phone}</p>
          <p><strong>العنوان:</strong> ${order.address || 'محدد على الخريطة'}</p>
          <p><strong>الحالة:</strong> <span style="color:#f59e0b;">${order.status}</span></p>
          <button class="btn btn-success" onclick="updateStatus('${order.id || order._id}', 'تم التوصيل بنجاح')">تم التوصيل ✅</button>
        </div>
      `).join('');
    } catch (err) {
      console.error('Error loading orders:', err);
    }
  }

  async function updateStatus(orderId, status) {
    try {
      await fetch(`/api/orders/${orderId}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      alert('تم تحديث حالة الطلب!');
      loadDriverOrders();
    } catch (err) {
      alert('حدث خطأ أثناء التحديث.');
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadDrivers();
    setInterval(loadDriverOrders, 4000);
  });
</script>
</body>
</html>
