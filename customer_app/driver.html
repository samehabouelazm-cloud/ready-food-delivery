<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>READY - تطبيق الكابتن</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 400: '#f59e0b', 500: '#f97316', 600: '#ea580c' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen antialiased">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-xl border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="bg-gradient-to-tr from-brand-600 to-amber-400 p-2 rounded-xl text-white">
          <i class="fa-solid fa-motorcycle text-xl"></i>
        </div>
        <span class="text-xl font-black tracking-wider text-slate-100">READY <span class="text-xs text-brand-400 font-normal">لوحة الكابتن</span></span>
      </div>
      <div class="flex items-center gap-2 text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1.5 rounded-full">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        متصل ومتوفر
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

    <!-- Status Overview -->
    <div class="grid grid-cols-2 gap-4">
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
        <span class="text-xs text-slate-400 block mb-1">الطلبات المكتملة</span>
        <span id="completed-count" class="text-2xl font-black text-slate-100">0</span>
      </div>
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
        <span class="text-xs text-slate-400 block mb-1">أرباح اليوم</span>
        <span id="total-earnings" class="text-2xl font-black text-emerald-400">0 <small class="text-xs text-slate-400">ج.م</small></span>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex border-b border-slate-800 gap-4 text-sm font-bold">
      <button onclick="setTab('pending')" id="tab-pending" class="pb-2 text-brand-400 border-b-2 border-brand-500">الطلبات المتاحة</button>
      <button onclick="setTab('in_delivery')" id="tab-in_delivery" class="pb-2 text-slate-400 hover:text-slate-200">جاري التوصيل</button>
      <button onclick="setTab('completed')" id="tab-completed" class="pb-2 text-slate-400 hover:text-slate-200">المكتملة</button>
    </div>

    <!-- Orders List Container -->
    <div id="orders-list" class="space-y-4">
      <div class="text-center py-12 text-slate-500 bg-slate-900/50 rounded-2xl border border-slate-800">
        <i class="fa-solid fa-box-open text-3xl mb-2 block"></i>
        جاري جلب الطلبات...
      </div>
    </div>

  </main>

  <script>
    let currentTab = 'pending';

    function setTab(tab) {
      currentTab = tab;
      ['pending', 'in_delivery', 'completed'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (btn) {
          if (t === tab) {
            btn.className = 'pb-2 text-brand-400 border-b-2 border-brand-500 font-bold';
          } else {
            btn.className = 'pb-2 text-slate-400 hover:text-slate-200';
          }
        }
      });
      fetchOrders();
    }

    async function fetchOrders() {
      try {
        const response = await fetch('/api/orders');
        const orders = await response.json();

        const completed = orders.filter(o => o.status === 'completed');
        document.getElementById('completed-count').innerText = completed.length;
        document.getElementById('total-earnings').innerHTML = `${completed.length * 20} <small class="text-xs text-slate-400">ج.م</small>`;

        const filtered = orders.filter(o => (o.status || 'pending') === currentTab);
        const container = document.getElementById('orders-list');

        if (!filtered || filtered.length === 0) {
          container.innerHTML = `
            <div class="text-center py-12 text-slate-500 bg-slate-900/50 rounded-2xl border border-slate-800">
              <i class="fa-solid fa-box-open text-3xl mb-2 block"></i>
              لا توجد طلبات في هذا القسم.
            </div>`;
          return;
        }

        container.innerHTML = filtered.map(order => `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
              <div>
                <span class="text-xs font-bold text-brand-400">طلب #${order._id ? order._id.slice(-4) : '0000'}</span>
                <h3 class="font-bold text-slate-100">${order.customerName || 'عميل'}</h3>
              </div>
              <span class="text-lg font-black text-amber-400">${order.totalAmount || 0} ج.م</span>
            </div>

            <div class="space-y-2 text-sm text-slate-300">
              <div class="flex items-start gap-2">
                <i class="fa-solid fa-location-dot text-brand-500 mt-1"></i>
                <div>
                  <span class="text-xs text-slate-500 block">العنوان:</span>
                  ${order.address || 'عنوان غير محدد'}
                </div>
              </div>
              <div class="flex items-start gap-2">
                <i class="fa-solid fa-utensils text-slate-500 mt-1"></i>
                <div>
                  <span class="text-xs text-slate-500 block">الوجبات:</span>
                  ${(order.items || []).map(i => `${i.title} (x${i.quantity})`).join(', ')}
                </div>
              </div>
            </div>

            ${(order.status || 'pending') === 'pending' ? `
              <button onclick="updateStatus('${order._id}', 'in_delivery')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-check"></i> قبول الطلب وبدء التوصيل
              </button>
            ` : order.status === 'in_delivery' ? `
              <button onclick="updateStatus('${order._id}', 'completed')" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-house-circle-check"></i> تم التوصيل للعميل
              </button>
            ` : `
              <div class="text-center text-xs text-emerald-400 font-bold bg-emerald-500/10 py-2 rounded-xl">
                ✅ تم إكمال هذا الطلب بنجاح
              </div>
            `}
          </div>
        `).join('');

      } catch (error) {
        console.error('Error fetching orders:', error);
      }
    }

    async function updateStatus(id, status) {
      await fetch(`/api/orders/${id}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      fetchOrders();
    }

    fetchOrders();
    setInterval(fetchOrders, 3000);
  </script>
</body>
</html>
