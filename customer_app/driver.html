<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>READY OS - تطبيق الكابتن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; }
        
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 0; 
            border-bottom: 1px solid var(--border-color); 
            margin-bottom: 20px; 
        }
        h1 { font-size: 20px; color: var(--accent-color); }
        
        .order-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
        }

        .customer-info { margin-bottom: 12px; font-size: 14px; }
        .customer-info div { margin-bottom: 4px; }
        .items-list { font-size: 13px; color: var(--text-secondary); margin-bottom: 15px; }

        .btn-deliver {
            width: 100%;
            padding: 12px;
            background-color: var(--success-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .badge-delivering {
            background-color: rgba(59, 130, 246, 0.2);
            color: var(--accent-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
        }

        .empty-state { text-align: center; padding: 40px; color: var(--text-secondary); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🚴‍♂️ لوحة طلبات الكابتن</h1>
            <span style="font-size: 13px; color: var(--success-color);">🟢 متاح للتوصيل</span>
        </header>

        <div id="driver-orders-container">
            <div class="empty-state">جاري جلب الطلبات المتاحة...</div>
        </div>
    </div>

    <script>
        async function fetchAcceptedOrders() {
            try {
                const response = await fetch('/api/orders');
                if (!response.ok) return;
                const orders = await response.json();
                
                // تصفية الطلبات المقبولة والجاري توصيلها فقط
                const driverOrders = orders.filter(o => o.status === 'accepted' || o.status === 'delivering');
                renderOrders(driverOrders);
            } catch (error) {
                console.error("خطأ في جلب الطلبات:", error);
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('driver-orders-container');
            
            if (orders.length === 0) {
                container.innerHTML = '<div class="empty-state">لا توجد طلبات جاهزة للتوصيل حالياً..</div>';
                return;
            }

            container.innerHTML = orders.map(order => {
                const itemsStr = (order.items || []).map(i => `${i.name} (x${i.quantity})`).join(', ');
                const isDelivering = order.status === 'delivering';

                return `
                    <div class="order-card">
                        <div class="order-header">
                            <strong>طلب #${(order._id || '').slice(-5)}</strong>
                            <span>${order.totalAmount || 0} ج.م</span>
                        </div>
                        <div class="customer-info">
                            <div>👤 <strong>العميل:</strong> ${order.customerName || 'عميل'}</div>
                            <div>📞 <strong>الهاتف:</strong> ${order.customerPhone || 'غير مدخل'}</div>
                        </div>
                        <div class="items-list">📦 ${itemsStr}</div>
                        ${
                            isDelivering 
                            ? `<div class="badge-delivering" style="text-align:center;">🚚 جاري التوصيل بواسطة: ${order.driverName || 'الكابتن'}</div>`
                            : `<button class="btn-deliver" onclick="acceptDelivery('${order._id}')">قبول واستلام الطلب</button>`
                        }
                    </div>
                `;
            }).join('');
        }

        async function acceptDelivery(orderId) {
            const driverName = prompt("أدخل اسم الكابتن للتأكيد:");
            if (!driverName) return;

            try {
                const response = await fetch('/api/orders/' + orderId + '/assign', {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ driverName: driverName })
                });

                if (response.ok) {
                    fetchAcceptedOrders();
                }
            } catch (error) {
                console.error("خطأ في استلام الطلب:", error);
            }
        }

        fetchAcceptedOrders();
        setInterval(fetchAcceptedOrders, 3000);
    </script>
</body>
</html>
