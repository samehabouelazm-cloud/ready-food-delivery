<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاهز في بلطيم - لوحة التحكم</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
    header h1 { color: #f59e0b; font-size: 22px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    .btn { background: #10b981; color: #fff; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    select, input { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; }
    .order-item { border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📦 جاهز في بلطيم - لوحة التحكم</h1>
    <button class="btn" onclick="loadAll()">تحديث البيانات 🔄</button>
  </header>

  <div class="card" style="margin-bottom: 20px;">
    <h3>🍔 إضافة وجبة / صنف جديد للقائمة</h3>
    <div style="display:flex; gap:10px; margin-top:10px;">
      <input type="text" id="itemName" placeholder="اسم الوجبة">
      <input type="text" id="itemCat" placeholder="التصنيف">
      <input type="number" id="itemPrice" placeholder="السعر">
      <button class="btn" onclick="addMenuItem()">إضافة ➕</button>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>🚴 إدارة الكباتن</h3>
      <div style="display:flex; gap:10px; margin-top:10px;">
        <input type="text" id="driverName" placeholder="اسم الكابتن">
        <input type="text" id="driverPhone" placeholder="رقم الجوال">
        <button class="btn" onclick="addDriver()">إضافة</button>
      </div>
      <div id="driversList" style="margin-top:15px;">جاري التحميل...</div>
    </div>

    <div class="card">
      <h3>🛒 الطلبات الواردة والمتابعة المباشرة</h3>
      <div id="ordersList">جاري التحميل...</div>
    </div>
  </div>
</div>

<script>
  async function loadAll() {
    loadDrivers();
    loadOrders();
  }

  async function loadDrivers() {
    try {
      const res = await fetch('/api/drivers');
      const drivers = await res.json();
      document.getElementById('driversList').innerHTML = drivers.map(d => `
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <span>${d.name} (${d.phone})</span>
          <button onclick="deleteDriver('${d.id}')" style="color:#ef4444; background:none; border:none; cursor:pointer;">حذف ❌</button>
        </div>
      `).join('');
    } catch(e) {}
  }

  async function loadOrders() {
    try {
      const resOrders = await fetch('/api/orders');
      const orders = await resOrders.json();
      const resDrivers = await fetch('/api/drivers');
      const drivers = await resDrivers.json();

      document.getElementById('ordersList').innerHTML = orders.map(o => `
        <div class="order-item">
          <p><strong>طلب #${o.id}</strong> - ${o.item || 'وجبة'}</p>
          <p>العميل: ${o.customerName || '-'} (${o.phone || '-'})</p>
          <p style="color:#f59e0b;">الحالة: ${o.status}</p>
          ${o.driverLocation ? `<p style="font-size:12px; color:#38bdf8;">📍 الإحداثيات: ${o.driverLocation.lat.toFixed(3)},${o.driverLocation.lng.toFixed(3)}</p>` : ''}
          <select onchange="assignDriver('${o.id}', this.value)">
            <option value="">إسناد لكابتن...</option>
            ${drivers.map(d => `<option value="${d.id}" ${o.driverId == d.id ? 'selected' : ''}>${d.name}</option>`).join('')}
          </select>
        </div>
      `).join('');
    } catch(e) {}
  }

  async function addDriver() {
    const name = document.getElementById('driverName').value;
    const phone = document.getElementById('driverPhone').value;
    if(!name) return;
    await fetch('/api/drivers', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name, phone })
    });
    loadAll();
  }

  async function deleteDriver(id) {
    await fetch(`/api/drivers/${id}`, { method: 'DELETE' });
    loadAll();
  }

  async function assignDriver(orderId, driverId) {
    if(!driverId) return;
    await fetch(`/api/orders/${orderId}/assign`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ driverId })
    });
    loadOrders();
  }

  async function addMenuItem() {
    const name = document.getElementById('itemName').value;
    const category = document.getElementById('itemCat').value;
    const price = document.getElementById('itemPrice').value;
    if(!name) return;
    await fetch('/api/menu', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name, category, price })
    });
    alert('تمت إضافة الوجبة');
  }

  document.addEventListener('DOMContentLoaded', loadAll);
</script>
</body>
</html>
