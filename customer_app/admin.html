<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>READY OS - لوحة إدارة المطعم</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #334155;
            margin-bottom: 25px;
        }
        .header h1 {
            color: #f59e0b;
            font-size: 24px;
        }
        .refresh-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .order-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .order-id {
            font-weight: bold;
            color: #94a3b8;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-pending { background: #f59e0b22; color: #f59e0b; border: 1px solid #f59e0b; }
        .status-delivering { background: #3b82f622; color: #3b82f6; border: 1px solid #3b82f6; }
        .status-completed { background: #10b98122; color: #10b981; border: 1px solid #10b981; }
        
        .customer-info, .items-list {
            margin-bottom: 15px;
            font-size: 14px;
            color: #cbd5e1;
        }
        .price {
            font-size: 18px;
            font-weight: bold;
            color: #10b981;
            margin-bottom: 15px;
        }
        .driver-box {
            background: #0f172a;
            border: 1px dashed #10b981;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
        }
        .driver-box p {
            font-size: 13px;
            margin-bottom: 4px;
        }
        .btn-auto-assign {
            background: #f59e0b;
            color: #0f172a;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-auto-assign:hover {
            background: #d97706;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📦 READY OS - لوحة التحكم وإسناد الكباتن</h1>
        <button class="refresh-btn" onclick="fetchOrders()">تحديث الطلبات 🔄</button>
    </div>

    <div id="ordersContainer" class="orders-grid">
        <p style="color: #94a3b8;">جاري تحميل الطلبات...</p>
    </div>

    <script>
        async function fetchOrders() {
            try {
                const res = await fetch('/api/orders');
                const orders = await res.json();
                const container = document.getElementById('ordersContainer');
                
                if (!orders || orders.length === 0) {
                    container.innerHTML = '<p style="color: #94a3b8;">لا توجد طلبات حالياً.</p>';
                    return;
                }

                container.innerHTML = '';
                orders.forEach(order => {
                    const card = document.createElement('div');
                    card.className = 'order-card';
                    
                    let statusClass = 'status-pending';
                    let statusText = 'قيد الانتظار';
                    if (order.status === 'delivering') { statusClass = 'status-delivering'; statusText = 'جاري التوصيل'; }
                    if (order.status === 'completed') { statusClass = 'status-completed'; statusText = 'مكتمل'; }

                    const itemsText = order.items && order.items.length > 0 
                        ? order.items.map(i => i.name || i.title || 'وجبة').join(', ') 
                        : 'طلب وجبات متنوعة';

                    card.innerHTML = `
                        <div>
                            <div class="order-header">
                                <span class="order-id">#${order._id.substring(order._id.length - 6)}</span>
                                <span class="badge ${statusClass}">${statusText}</span>
                            </div>
                            <div class="customer-info">
                                <strong>العميل:</strong> ${order.customerName || 'عميل READY'}<br>
                                <strong>الهاتف:</strong> ${order.customerPhone || 'غير مسجل'}
                            </div>
                            <div class="items-list">
                                <strong>العناصر:</strong> ${itemsText}
                            </div>
                            <div class="price">
                                ${order.totalAmount || 0} ج.م
                            </div>
                        </div>

                        <div>
                            ${order.driverName ? `
                                <div class="driver-box">
                                    <p>🚴 <strong>الكابتن:</strong> ${order.driverName}</p>
                                    <p>📞 <strong>جوال الكابتن:</strong> <a href="tel:${order.driverPhone}" style="color: #38bdf8;">${order.driverPhone || 'غير متوفر'}</a></p>
                                </div>
                            ` : `
                                <button class="btn-auto-assign" onclick="autoAssign('${order._id}')">
                                    ⚡ إسناد تلقائي للكابتن الأقرب
                                </button>
                            `}
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('ordersContainer').innerHTML = '<p style="color: #ef4444;">حدث خطأ أثناء تحميل الطلبات.</p>';
            }
        }

        async function autoAssign(orderId) {
            try {
                const res = await fetch(`/api/orders/${orderId}/auto-assign`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                
                if (data.success) {
                    alert(data.message);
                    fetchOrders();
                } else {
                    alert('تعذر الإسناد: ' + (data.message || 'لا يوجد كباتن متاحون'));
                }
            } catch (err) {
                alert('حدث خطأ أثناء الاتصال بالسيرفر');
            }
        }

        // جلب الطلبات فور فتح الصفحة وتحديثها تلقائياً كل 8 ثوانٍ
        fetchOrders();
        setInterval(fetchOrders, 8000);
    </script>
</body>
</html>
