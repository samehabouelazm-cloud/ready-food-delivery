<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>READY OS - لوحة إدارة المطعم والطلبات</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #334155;
            margin-bottom: 25px;
        }
        .header h1 {
            color: #f59e0b;
            font-size: 24px;
        }
        .refresh-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .order-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .order-id {
            font-weight: bold;
            color: #94a3b8;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-pending { background: #f59e0b22; color: #f59e0b; border: 1px solid #f59e0b; }
        .status-delivering { background: #3b82f622; color: #3b82f6; border: 1px solid #3b82f6; }
        .status-completed { background: #10b98122; color: #10b981; border: 1px solid #10b981; }
        
        .customer-info, .items-list {
            margin-bottom: 12px;
            font-size: 14px;
            color: #cbd5e1;
        }
        .price {
            font-size: 18px;
            font-weight: bold;
            color: #10b981;
            margin-bottom: 15px;
        }
        .driver-box {
            background: #0f172a;
            border: 1px dashed #10b981;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .driver-box p {
            font-size: 13px;
            margin-bottom: 4px;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-auto-assign {
            background: #f59e0b;
            color: #0f172a;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-delete {
            background: #ef444422;
            color: #ef4444;
            border: 1px solid #ef4444;
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-delete:hover {
            background: #ef4444;
            color: white;
        }
        .btn-unassign {
            background: #64748b;
            color: white;
            border: none;
            width: 100%;
            padding: 6px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📦 READY OS - لوحة التحكم وإسناد الطلبات</h1>
        <button class="refresh-btn" onclick="fetchOrders()">تحديث الطلبات 🔄</button>
    </div>

    <div id="ordersContainer" class="orders-grid">
        <p style="color: #94a3b8;">جاري تحميل الطلبات...</p>
    </div>

    <script>
        async function fetchOrders() {
            try {
                const res = await fetch('/api/orders');
                const orders = await res.json();
                const container = document.getElementById('ordersContainer');
                
                if (!orders || orders.length === 0) {
                    container.innerHTML = '<p style="color: #94a3b8;">لا توجد طلبات حالياً.</p>';
                    return;
                }

                container.innerHTML = '';
                orders.forEach(order => {
                    const card = document.createElement('div');
                    card.className = 'order-card';
                    
                    let statusClass = 'status-pending';
                    let statusText = 'قيد الانتظار';
                    if (order.status === 'delivering') { statusClass = 'status-delivering'; statusText = 'جاري التوصيل'; }
                    if (order.status === 'completed') { statusClass = 'status-completed'; statusText = 'مكتمل'; }

                    const itemsText = order.items && order.items.length > 0 
                        ? order.items.map(i => i.name || i.title || 'وجبة').join(', ') 
                        : 'طلب وجبات متنوعة';

                    card.innerHTML = `
                        <div>
                            <div class="order-header">
                                <span class="order-id">#${order._id.substring(order._id.length - 6)}</span>
                                <span class="badge ${statusClass}">${statusText}</span>
                            </div>
                            <div class="customer-info">
                                <strong>العميل:</strong> ${order.customerName || 'عميل جديد'}<br>
                                <strong>الهاتف:</strong> ${order.customerPhone || 'غير مسجل'}
                            </div>
                            <div class="items-list">
                                <strong>العناصر:</strong> ${itemsText}
                            </div>
                            <div class="price">
                                ${order.totalAmount || 0} ج.م
                            </div>
                        </div>

                        <div>
                            ${order.driverName ? `
                                <div class="driver-box">
                                    <p>🚴 <strong>الكابتن:</strong> ${order.driverName}</p>
                                    <p>📞 <strong>جوال الكابتن:</strong> <a href="tel:${order.driverPhone}" style="color: #38bdf8;">${order.driverPhone || 'غير متوفر'}</a></p>
                                    <button class="btn-unassign" onclick="unassignDriver('${order._id}')">إلغاء إسناد الكابتن (إبقاء الطلب)</button>
                                </div>
                            ` : `
                                <button class="btn-auto-assign" style="margin-bottom:8px;" onclick="autoAssign('${order._id}')">
                                    ⚡ إسناد تلقائي للكابتن الأقرب
                                </button>
                            `}

                            <div class="action-buttons">
                                <button class="btn-delete" onclick="deleteOrder('${order._id}')">
                                    🗑️ حذف الطلب
                                </button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('ordersContainer').innerHTML = '<p style="color: #ef4444;">حدث خطأ أثناء تحميل الطلبات.</p>';
            }
        }

        // إسناد كابتن تلقائي
        async function autoAssign(orderId) {
            try {
                const res = await fetch(`/api/orders/${orderId}/auto-assign`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    alert(data.message);
                    fetchOrders();
                } else {
                    alert('تعذر الإسناد: ' + (data.message || 'خطأ بالسيرفر'));
                }
            } catch (err) {
                alert('حدث خطأ أثناء الاتصال بالسيرفر');
            }
        }

        // إلغاء إسناد الكابتن مع إبقاء الطلب
        async function unassignDriver(orderId) {
            if (!confirm('هل تريد إزالة الكابتن من الطلب وإبقاؤه في قائمة الانتظار؟')) return;
            try {
                const res = await fetch(`/api/orders/${orderId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ driverName: '', driverPhone: '', status: 'pending' })
                });
                const data = await res.json();
                if (data.success) {
                    fetchOrders();
                }
            } catch (err) {
                alert('فشل التعديل على الطلب');
            }
        }

        // حذف الطلب بشكل نهائي
        async function deleteOrder(orderId) {
            if (!confirm('هل أنت تأكد من رغبتك في حذف هذا الطلب نهائياً؟')) return;
            try {
                const res = await fetch(`/api/orders/${orderId}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    fetchOrders();
                } else {
                    alert('فشل حذف الطلب');
                }
            } catch (err) {
                alert('حدث خطأ أثناء تنفيذ عملية الحذف');
            }
        }

        fetchOrders();
        setInterval(fetchOrders, 8000);
    </script>
</body>
</html>
<!-- نموذج إضافة وجبة جديدة -->
<div style="background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #334155;">
    <h2 style="color: #f59e0b; font-size: 18px; margin-bottom: 15px;">🍔 إضافة وجبة / صنف جديد للقائمة</h2>
    <form id="addMenuForm" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
        <input type="text" id="itemName" placeholder="اسم الوجبة" required style="padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white;">
        <input type="text" id="itemCategory" placeholder="التصنيف (مثل: مشويات، بيتزا)" required style="padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white;">
        <input type="number" id="itemPrice" placeholder="السعر (ج.م)" required style="padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white;">
        <input type="url" id="itemImage" placeholder="رابط الصورة (اختياري)" style="padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white;">
        <button type="submit" style="background: #10b981; color: white; font-weight: bold; border: none; padding: 10px; border-radius: 6px; cursor: pointer;">إضافة إلى المنيو ➕</button>
    </form>
</div>

<script>
// كود إرسال الوجبة الجديدة للسيرفر
document.getElementById('addMenuForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const newItem = {
        name: document.getElementById('itemName').value,
        category: document.getElementById('itemCategory').value,
        price: Number(document.getElementById('itemPrice').value),
        imageUrl: document.getElementById('itemImage').value || 'https://via.placeholder.com/150'
    };

    try {
        const res = await fetch('/api/menu', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newItem)
        });
        const data = await res.json();
        if (data.success) {
            alert('تمت إضافة الوجبة بنجاح!');
            document.getElementById('addMenuForm').reset();
        } else {
            alert('حدث خطأ أثناء الإضافة');
        }
    } catch (err) {
        alert('تعذر الاتصال بالسيرفر');
    }
});
</script>
